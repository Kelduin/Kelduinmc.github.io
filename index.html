<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a0a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Our Hub</title>
    
    <style>
        /* --- 1. CORE VARIABLES & RESET --- */
        :root {
            --bg: #0a0a0a;
            --surface: #1a1a1a;
            --primary: #e50914; 
            --accent: #46d369;  
            --text: #ffffff;
            --text-dim: #888888;
            --nav-height: 70px;
            --safe-bottom: env(safe-area-inset-bottom);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0; padding: 0;
            padding-bottom: calc(var(--nav-height) + var(--safe-bottom) + 20px);
            overflow-x: hidden;
        }

        /* --- 2. HEADER --- */
        header {
            position: sticky; top: 0; z-index: 50;
            background: rgba(10, 10, 10, 0.9);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            padding: 15px 20px 10px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            display: flex; flex-direction: column; gap: 15px;
        }

        .header-top { display: flex; justify-content: space-between; align-items: center; }
        h1 { margin: 0; font-size: 1.4rem; font-weight: 800; letter-spacing: 0.5px; }
        
        .dice-btn {
            font-size: 1.4rem; background: rgba(255,255,255,0.1); 
            border: none; cursor: pointer; border-radius: 50%; width: 40px; height: 40px;
            display: flex; align-items: center; justify-content: center;
            transition: transform 0.2s, background 0.2s;
        }
        .dice-btn:active { transform: rotate(180deg) scale(0.9); background: rgba(255,255,255,0.2); }

        /* Chips Scroll */
        .chip-scroll {
            display: flex; gap: 8px; overflow-x: auto;
            padding-bottom: 5px; scrollbar-width: none;
        }
        .chip-scroll::-webkit-scrollbar { display: none; }

        .chip {
            background: var(--surface); border: 1px solid rgba(255,255,255,0.15);
            color: var(--text-dim); padding: 6px 14px; border-radius: 20px;
            font-size: 0.8rem; font-weight: 600; white-space: nowrap;
            transition: all 0.2s; cursor: pointer;
        }
        .chip.active {
            background: var(--text); color: var(--bg); border-color: var(--text);
        }

        /* --- 3. THE GRID --- */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); 
            gap: 12px;
            padding: 15px;
        }

        .card {
            background: var(--surface); border-radius: 12px; overflow: hidden;
            position: relative; aspect-ratio: 2/3;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: transform 0.15s; cursor: pointer;
        }
        .card:active { transform: scale(0.96); }

        .card-img {
            width: 100%; height: 100%; object-fit: cover;
            background: #222; transition: opacity 0.3s;
        }

        /* --- 4. AVATAR STATUS LOGIC --- */
        .card-overlay {
            position: absolute; inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.95) 10%, rgba(0,0,0,0.4) 40%, transparent 80%);
            display: flex; flex-direction: column; justify-content: flex-end;
            padding: 10px;
        }

        .card-title {
            font-size: 0.8rem; font-weight: 700; text-shadow: 0 2px 4px black;
            margin-bottom: 8px; line-height: 1.2;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        }

        .status-row {
            display: flex; justify-content: space-between; align-items: flex-end;
            width: 100%;
        }

        .avatar-group { display: flex; gap: -5px; } /* Overlap effect */
        
        .avatar { 
            width: 24px; height: 24px; border-radius: 50%; 
            border: 2px solid var(--surface);
            background-size: cover; background-position: center;
            transition: all 0.3s ease;
            
            /* Ghost State (Unwatched) */
            filter: grayscale(100%) opacity(0.5); 
            transform: scale(0.9);
        }

        .avatar.watched {
            /* Active State (Watched) */
            filter: grayscale(0%) opacity(1);
            transform: scale(1.1);
            border-color: var(--accent);
            z-index: 2;
        }

        .badge-rating {
            font-size: 0.7rem; font-weight: bold; color: #f5c518;
            background: rgba(0,0,0,0.6); padding: 2px 6px; border-radius: 4px;
            backdrop-filter: blur(4px);
        }

        /* --- 5. BOTTOM NAV --- */
        .nav-bar {
            position: fixed; bottom: 0; left: 0; right: 0;
            height: calc(var(--nav-height) + var(--safe-bottom));
            background: rgba(10,10,10,0.95);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255,255,255,0.08);
            display: flex; justify-content: space-around;
            padding-top: 12px; z-index: 100;
        }

        .nav-item {
            display: flex; flex-direction: column; align-items: center; gap: 4px;
            color: var(--text-dim); background: none; border: none;
            font-size: 0.7rem; font-weight: 600; width: 33%; cursor: pointer;
            transition: color 0.2s;
        }
        .nav-icon { font-size: 1.5rem; transition: transform 0.2s; }
        .nav-item.active { color: var(--text); }
        .nav-item.active .nav-icon { transform: scale(1.1); color: var(--primary); }
        /* Different color for Game Mode */
        .nav-item.game-active.active .nav-icon { color: #d63031; }

        /* --- 6. MODAL --- */
        .modal {
            position: fixed; inset: 0; z-index: 200;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(8px);
            display: none; align-items: center; justify-content: center;
            opacity: 0; transition: opacity 0.2s;
        }
        .modal.open { display: flex; opacity: 1; }

        .modal-content {
            width: 90%; max-width: 450px; max-height: 85vh;
            background: var(--surface); border-radius: 24px;
            overflow-y: auto; position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp { from { transform: translateY(50px); opacity:0; } to { transform: translateY(0); opacity:1; } }

        .hero-img {
            width: 100%; height: 250px; object-fit: cover;
            mask-image: linear-gradient(to bottom, black 50%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, black 50%, transparent 100%);
        }

        .modal-body { padding: 0 25px 30px 25px; margin-top: -60px; position: relative; }
        
        .modal-title { font-size: 1.8rem; font-weight: 800; line-height: 1.1; margin-bottom: 10px; text-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        
        .meta-row { display: flex; gap: 10px; margin-bottom: 20px; color: #ccc; font-size: 0.85rem; font-weight: 600; }
        .pill { background: #333; padding: 4px 10px; border-radius: 20px; }
        
        .desc-text { line-height: 1.6; color: #b0b0b0; margin-bottom: 25px; font-size: 0.95rem; }
        
        .note-box {
            background: rgba(255, 215, 0, 0.05); border-left: 3px solid #ffd700;
            padding: 15px; border-radius: 0 8px 8px 0; font-style: italic; color: #e6e6e6;
        }

        .close-btn {
            position: absolute; top: 15px; right: 15px;
            width: 32px; height: 32px; border-radius: 50%;
            background: rgba(0,0,0,0.5); color: white; border: 1px solid rgba(255,255,255,0.2);
            font-size: 1rem; cursor: pointer; z-index: 10;
            backdrop-filter: blur(4px);
        }

        /* Loader */
        .loader { 
            position: fixed; inset: 0; background: var(--bg); z-index: 999;
            display: flex; justify-content: center; align-items: center;
            color: var(--text-dim); font-weight: bold; letter-spacing: 1px;
            transition: opacity 0.5s;
        }

    </style>
</head>
<body>

    <div class="loader" id="loader">SYNCING...</div>

    <header>
        <div class="header-top">
            <h1 id="pageTitle">Watchlist</h1>
            <button class="dice-btn" onclick="spinRoulette()">🎲</button>
        </div>
        <div class="chip-scroll" id="chipContainer"></div>
    </header>

    <div class="grid" id="mainGrid"></div>

    <nav class="nav-bar">
        <button class="nav-item active" id="navWatch" onclick="switchMode('Watch', this)">
            <span class="nav-icon">🍿</span>
            <span>Watch</span>
        </button>
        <button class="nav-item" id="navGame" onclick="switchMode('Game', this)">
            <span class="nav-icon">🎮</span>
            <span>Games</span>
        </button>
    </nav>

    <div class="modal" id="infoModal" onclick="closeModal(event)">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal()">✕</button>
            <img src="" class="hero-img" id="mImg">
            <div class="modal-body">
                <div class="modal-title" id="mTitle"></div>
                <div class="meta-row">
                    <span class="pill" id="mYear"></span>
                    <span class="pill" id="mCat"></span>
                    <span class="pill" id="mImdb" style="color:#f5c518"></span>
                </div>
                <div class="desc-text" id="mDesc"></div>
                <div class="note-box" id="mNote"></div>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        //  ⚙️ YOUR CONFIGURATION (EDIT THIS PART)
        // ==========================================

        // 1. Paste your Google Sheet CSV Link here:
        const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vR6tOms_iF0Jp-Bw6LKyUCDOXvB2O1JtTC3Cgd9C1uGzHO6yEQJvtb6q07cVMK_C7K4sErvvICu7D4-/pub?output=csv";
        
        // 2. Paste links to your Avatar images here:
        const MY_AVATAR = "https://cdn-icons-png.flaticon.com/512/4140/4140048.png"; // Example: Boy icon
        const HER_AVATAR = "https://cdn-icons-png.flaticon.com/512/4140/4140047.png"; // Example: Girl icon

        // ==========================================

        let allData = [];
        let currentMode = "Watch"; 
        let currentFilter = "All";

        async function init() {
            try {
                const response = await fetch(SHEET_URL);
                const csvText = await response.text();
                allData = parseCSV(csvText);
                
                // Hide loader
                const loader = document.getElementById('loader');
                loader.style.opacity = '0';
                setTimeout(() => loader.style.display = 'none', 500);
                
                renderApp();
            } catch (err) {
                document.getElementById('loader').innerText = "ERROR LOADING DATA";
                console.error(err);
            }
        }

        // CSV Parser that handles commas inside descriptions
        function parseCSV(csv) {
            const lines = csv.split('\n').filter(l => l.trim() !== '');
            const headers = lines[0].split(',').map(h => h.trim().replace(/"/g, ''));
            
            // Regex to match CSV fields including quoted strings
            const regex = /(?:,|\n|^)("(?:(?:"")*[^"]*)*"|[^",\n]*|(?:\n|$))/g;
            
            return lines.slice(1).map(line => {
                let matches = [];
                let match;
                while ((match = regex.exec(line)) !== null) {
                    // Fix empty matches at end of line
                    if (match.index === regex.lastIndex) regex.lastIndex++; 
                    if(match[1]) matches.push(match[1].replace(/^"|"$/g, '').replace(/""/g, '"')); 
                }
                // Cleanup matches to match header length
                matches = matches.filter(m => m !== undefined).slice(0, headers.length);
                
                let entry = {};
                headers.forEach((h, i) => entry[h] = matches[i] ? matches[i].trim() : "");
                
                // Convert Booleans
                entry.Me = entry.Me && entry.Me.toLowerCase() === 'true';
                entry.Her = entry.Her && entry.Her.toLowerCase() === 'true';
                
                return entry;
            });
        }

        function switchMode(mode, btn) {
            currentMode = mode;
            currentFilter = "All";
            
            // Update Nav Styles
            document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            // Theme Coloring
            document.documentElement.style.setProperty('--primary', mode === 'Watch' ? '#e50914' : '#d63031');
            document.getElementById('pageTitle').innerText = mode === 'Watch' ? 'Watchlist' : 'Game Library';
            
            renderApp();
        }

        function renderApp() {
            const data = allData.filter(item => item.Type === currentMode);
            const grid = document.getElementById('mainGrid');
            const chipContainer = document.getElementById('chipContainer');

            // 1. Chips
            const categories = ['All', ...new Set(data.map(i => i.Category))].sort();
            chipContainer.innerHTML = '';
            categories.forEach(cat => {
                const chip = document.createElement('button');
                chip.className = `chip ${currentFilter === cat ? 'active' : ''}`;
                chip.innerText = cat;
                chip.onclick = () => { currentFilter = cat; renderApp(); };
                chipContainer.appendChild(chip);
            });

            // 2. Grid
            grid.innerHTML = '';
            const filtered = currentFilter === 'All' ? data : data.filter(i => i.Category === currentFilter);

            if (filtered.length === 0) {
                grid.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:50px; color:#555">Nothing found... yet.</div>';
                return;
            }

            filtered.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => openModal(item);

                // Fallback image
                const imgUrl = item.Image.includes('http') ? item.Image : 'https://placehold.co/400x600/222/999?text=' + item.Title;
                
                // Avatar Classes
                const meClass = item.Me ? 'watched' : '';
                const herClass = item.Her ? 'watched' : '';

                card.innerHTML = `
                    <img src="${imgUrl}" class="card-img" loading="lazy">
                    <div class="card-overlay">
                        <div class="card-title">${item.Title}</div>
                        <div class="status-row">
                            <div class="avatar-group">
                                <div class="avatar ${meClass}" style="background-image: url('${MY_AVATAR}')"></div>
                                <div class="avatar ${herClass}" style="background-image: url('${HER_AVATAR}')"></div>
                            </div>
                            ${item.IMDB ? `<div class="badge-rating">★ ${item.IMDB}</div>` : ''}
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function openModal(item) {
            document.getElementById('mImg').src = item.Image;
            document.getElementById('mTitle').innerText = item.Title;
            document.getElementById('mYear').innerText = item.Year || 'N/A';
            document.getElementById('mCat').innerText = item.Category || 'General';
            document.getElementById('mImdb').innerText = item.IMDB ? `★ ${item.IMDB}` : '';
            document.getElementById('mDesc').innerText = item.Desc || 'No description available.';
            
            const noteDiv = document.getElementById('mNote');
            if(item.Note) {
                noteDiv.style.display = 'block';
                noteDiv.innerText = "Note: " + item.Note;
            } else {
                noteDiv.style.display = 'none';
            }
            document.getElementById('infoModal').classList.add('open');
        }

        function closeModal(e) {
            if (!e || e.target.classList.contains('modal') || e.target.classList.contains('close-btn')) {
                document.getElementById('infoModal').classList.remove('open');
            }
        }

        function spinRoulette() {
            const data = allData.filter(item => item.Type === currentMode);
            // Only pick items that at least ONE person hasn't seen
            const pending = data.filter(i => (!i.Me || !i.Her)); 

            if(pending.length === 0) {
                alert("You two have finished everything in this list! Time to add more rows.");
                return;
            }
            const winner = pending[Math.floor(Math.random() * pending.length)];
            alert(`🎲 Destiny has chosen:\n\n${winner.Title}`);
            openModal(winner);
        }

        init();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Our Hub</title>
    
    <link rel="apple-touch-icon" href="https://em-content.zobj.net/source/apple/354/clapper-board_1f3ac.png">
    <link rel="icon" type="image/png" href="https://em-content.zobj.net/source/apple/354/clapper-board_1f3ac.png">

    <style>
        :root {
            --bg-color: #050505;
            --card-bg: #1a1a1a;
            --text-color: #ffffff;
            --accent: #e50914;
            --green: #46d369;
            --pink: #ff69b4;
            --yellow: #fdd835;
            --gold: #ffd700;
            --card-width: 145px;
            --card-height: 220px;
            --radius: 16px;
            --safe-top: env(safe-area-inset-top);
            --safe-bottom: env(safe-area-inset-bottom);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            padding-bottom: calc(80px + var(--safe-bottom));
            overflow-x: hidden;
            user-select: none;
        }

        #loadingScreen {
            position: fixed; inset: 0;
            background: var(--bg-color);
            z-index: 3000;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            color: white; font-size: 1.2rem; font-weight: bold;
        }
        .spinner {
            width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.1);
            border-top-color: var(--accent); border-radius: 50%;
            animation: spin 1s linear infinite; margin-bottom: 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        #hubScreen {
            position: fixed; inset: 0; 
            background: linear-gradient(135deg, #050505 0%, #1a1a1a 100%);
            z-index: 2000; 
            display: none; flex-direction: column; 
            align-items: center; justify-content: center; 
            gap: 25px; 
        }

        .hub-title {
            font-size: 2.2rem; margin-bottom: 10px; 
            text-transform: uppercase; letter-spacing: 2px;
            font-weight: 900;
            text-shadow: 0 0 20px rgba(255,255,255,0.1);
        }

        .hub-btn {
            background: rgba(20,20,20,0.6);
            border: 2px solid;
            padding: 25px 30px;
            font-size: 1.4rem;
            font-weight: 800;
            text-transform: uppercase;
            border-radius: 24px;
            cursor: pointer;
            width: 85%; max-width: 350px;
            transition: transform 0.2s, background 0.2s, box-shadow 0.2s;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .hub-btn:active { transform: scale(0.96); }
        .btn-watch { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 20px rgba(229,9,20,0.15); }
        .btn-play { border-color: var(--green); color: var(--green); box-shadow: 0 0 20px rgba(70,211,105,0.15); }

        .hub-sub-menu {
            display: none; flex-direction: column; gap: 15px; 
            width: 85%; max-width: 320px; 
            animation: fadeIn 0.3s cubic-bezier(0.1, 0.7, 1.0, 0.1);
        }

        .hub-sub-btn {
            background: #222;
            color: white;
            border: 1px solid #333;
            padding: 20px;
            border-radius: 16px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            display: flex; align-items: center; gap: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: background 0.2s;
        }
        .hub-sub-btn:active { background: #333; transform: scale(0.98); }

        @keyframes fadeIn { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }

        header {
            padding: calc(15px + var(--safe-top)) 20px 10px 20px;
            background: linear-gradient(to bottom, rgba(5,5,5,0.98) 0%, rgba(5,5,5,0.9) 70%, rgba(5,5,5,0) 100%);
            position: sticky; top: 0; z-index: 50;
            text-align: center;
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            display: flex; align-items: center; justify-content: center;
        }

        .home-btn {
            position: absolute; left: 20px; 
            background: rgba(255,255,255,0.1); border: none; color: white;
            width: 36px; height: 36px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem; cursor: pointer;
            transition: background 0.2s;
        }
        .home-btn:active { background: rgba(255,255,255,0.3); }

        h1 { 
            margin: 0; font-size: 1.3rem; font-weight: 800;
            color: white; text-transform: uppercase; letter-spacing: 1px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .controls {
            padding: 5px 15px; display: flex; flex-direction: column; 
            gap: 12px; align-items: center; margin-bottom: 10px;
        }

        .btn-roulette {
            background: linear-gradient(135deg, #444, #222);
            border: 1px solid #555;
            color: white; padding: 12px 40px;
            font-size: 0.95rem; font-weight: 700;
            border-radius: 50px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            cursor: pointer; width: 100%; max-width: 300px;
            transition: transform 0.2s;
        }
        .btn-roulette:active { transform: scale(0.96); }

        .filter-scroll {
            display: flex; gap: 8px; overflow-x: auto; width: 100%; 
            padding: 5px 5px 15px 5px; scrollbar-width: none;
        }
        .filter-scroll::-webkit-scrollbar { display: none; }

        .chip {
            background: #222; color: #888; border: 1px solid #333;
            padding: 8px 18px; border-radius: 50px; 
            font-size: 0.85rem; font-weight: 600;
            white-space: nowrap; cursor: pointer; transition: all 0.2s;
            flex-shrink: 0;
        }
        .chip.active { background: white; color: black; border-color: white; box-shadow: 0 4px 10px rgba(255,255,255,0.2); }

        .dropdown-row { 
            display: flex; gap: 8px; width: 100%; max-width: 600px; 
            flex-wrap: wrap; justify-content: center; 
        }
        
        .select-wrapper { position: relative; flex: 1 1 100px; }
        
        select, .form-input {
            width: 100%; appearance: none; -webkit-appearance: none;
            background: #222; color: #ddd; border: 1px solid #333;
            padding: 10px 15px; border-radius: 12px; 
            font-size: 0.8rem; font-weight: 600; outline: none;
        }
        .form-input { font-size: 0.9rem; font-weight: 500; margin-bottom: 12px; }
        .form-input::placeholder { color: #666; }
        
        .select-wrapper::after {
            content: '▼'; font-size: 0.5rem; color: #888;
            position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
            pointer-events: none;
        }

        .section-header {
            padding: 0 20px; margin-top: 25px; margin-bottom: 12px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .section-title { font-size: 1.1rem; font-weight: 700; color: #fff; letter-spacing: 0.5px; }
        
        .scroll-arrows { display: none; gap: 8px; }
        @media (hover: hover) { .scroll-arrows { display: flex; } }
        
        .arrow-btn {
            background: rgba(255,255,255,0.1); border: none; color: white;
            width: 28px; height: 28px; border-radius: 50%; cursor: pointer; font-weight: bold;
        }

        .row-container {
            display: flex; overflow-x: auto; gap: 14px;
            padding: 0 20px 10px 20px;
            scroll-snap-type: x mandatory; scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch; scrollbar-width: none;
        }
        .row-container::-webkit-scrollbar { display: none; }

        .grid-container {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px; padding: 0 20px; margin-top: 20px;
        }

        .card {
            flex: 0 0 var(--card-width); height: var(--card-height);
            background-color: var(--card-bg); border-radius: var(--radius); 
            overflow: hidden; position: relative; scroll-snap-align: start; 
            cursor: pointer; transition: transform 0.1s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .card:active { transform: scale(0.96); }
        .card.dimmed { opacity: 0.4; filter: grayscale(80%); }

        .card-image { width: 100%; height: 100%; background-size: cover; background-position: center; transition: opacity 0.3s; }
        
        .imdb-badge {
            position: absolute; top: 8px; right: 8px;
            background: rgba(0,0,0,0.8); color: var(--gold); border: 1px solid var(--gold);
            font-weight: 700; padding: 2px 6px; border-radius: 6px; 
            font-size: 0.6rem; z-index: 5; backdrop-filter: blur(4px);
        }

        .card-overlay {
            position: absolute; inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,1) 0%, rgba(0,0,0,0.6) 20%, rgba(0,0,0,0) 60%);
            display: flex; flex-direction: column; justify-content: flex-end; padding: 12px;
        }
        .card-title { font-size: 0.8rem; font-weight: 700; line-height: 1.3; margin-bottom: 6px; text-shadow: 0 2px 4px black; }
        .card-status { font-size: 0.65rem; display: flex; align-items: center; gap: 6px; font-weight: 600; }
        .status-dot { width: 6px; height: 6px; border-radius: 50%; box-shadow: 0 0 5px currentColor; }

        .s-new { color: var(--green); } .d-new { background: var(--green); }
        .s-done { color: #666; } .d-done { background: #666; }
        .s-note { color: var(--yellow); } .d-note { background: var(--yellow); }

        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.95);
            z-index: 2500; display: none; flex-direction: column; 
            align-items: center; justify-content: center;
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
        }
        .nav-zone { position: absolute; top: 0; bottom: 0; width: 15%; z-index: 101; }
        .nav-left { left: 0; } .nav-right { right: 0; }
        
        .info-card { width: 100%; max-width: 500px; height: 100%; max-height: 100vh; background: #111; display: flex; flex-direction: column; overflow-y: auto; position: relative; }
        .info-hero { flex-shrink: 0; height: 45vh; width: 100%; background-size: cover; background-position: center; position: relative; }
        .info-hero::after { content:''; position:absolute; inset:0; background: linear-gradient(to top, #111 5%, transparent); }
        .info-content { padding: 25px 25px 80px 25px; }
        .info-title { font-size: 1.6rem; font-weight: 800; line-height: 1.1; margin-bottom: 15px; color: white; }
        .info-tags { display: flex; flex-wrap: wrap; gap: 8px; color: #999; font-size: 0.85rem; margin-bottom: 20px; line-height: 1.5; }
        .tag-pill { background: #222; border: 1px solid #333; padding: 4px 10px; border-radius: 20px; color: #ccc; font-size: 0.75rem; }
        .info-desc { color: #ccc; line-height: 1.6; margin-bottom: 25px; font-size: 0.95rem; }
        .info-note { background: #1a1a1a; padding: 20px; border-left: 4px solid var(--accent); color: #ddd; font-style: italic; border-radius: 8px; font-size: 0.9rem; }
        
        .close-btn-float {
            position: absolute; top: calc(20px + var(--safe-top)); right: 20px; z-index: 2600; 
            background: rgba(0,0,0,0.5); color: white; border: 1px solid rgba(255,255,255,0.3);
            width: 40px; height: 40px; border-radius: 50%; cursor: pointer; font-weight: bold;
            display: flex; align-items: center; justify-content: center; backdrop-filter: blur(4px);
        }

        .form-box {
            background: #111; border: 1px solid #333; border-radius: 24px;
            padding: 30px 20px; width: 90%; max-width: 400px; max-height: 85vh; overflow-y: auto;
            display: flex; flex-direction: column; gap: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .form-box h2 { margin: 0 0 15px 0; color: white; font-size: 1.5rem; text-align: center; }
        .form-btn {
            background: var(--accent); color: white; border: none; padding: 15px;
            border-radius: 12px; font-weight: bold; font-size: 1rem; cursor: pointer; margin-top: 10px;
        }

        .add-float-btn {
            position: fixed; bottom: calc(20px + var(--safe-bottom)); right: 20px;
            background: var(--accent); color: white; border: none;
            width: 60px; height: 60px; border-radius: 50%; font-size: 2rem;
            display: none; align-items: center; justify-content: center;
            box-shadow: 0 4px 15px rgba(229,9,20,0.4); cursor: pointer; z-index: 1000;
        }

        #rouletteModal { background: rgba(0,0,0,0.98); z-index: 2600;}
        .roulette-wrapper { width: 95%; max-width: 500px; height: 180px; border: 3px solid #333; background: #000; overflow: hidden; position: relative; margin: 0 auto; border-radius: 16px;}
        .roulette-track { display: flex; height: 100%; position: absolute; left: 0; }
        .r-card { width: 130px; height: 100%; background-size: cover; border-right: 1px solid #111; flex-shrink: 0; }
        .r-line { position: absolute; left: 50%; top: 0; bottom: 0; width: 4px; background: var(--gold); transform: translateX(-50%); z-index: 10; box-shadow: 0 0 15px var(--gold); }

    </style>
</head>
<body>

    <div id="loadingScreen">
        <div class="spinner"></div>
        <div id="loadingText">Connecting to database...</div>
    </div>

    <div id="hubScreen">
        <h1 class="hub-title">What's the plan?</h1>
        
        <button onclick="window.enterSection('watch')" class="hub-btn btn-watch">
            🍿 Watch Stuff
        </button>
        
        <button onclick="window.showGameOptions()" class="hub-btn btn-play">
            🎮 Play Games
        </button>

        <div id="gameSubMenu" class="hub-sub-menu">
            <button onclick="window.enterSection('play-together')" class="hub-sub-btn" style="border-left: 4px solid var(--pink);">
                <span style="font-size:1.5rem;">💞</span> 
                <div style="text-align:left;">
                    <div style="font-size:0.8rem; color:#888;">CO-OP MODE</div>
                    <div>Play Together</div>
                </div>
            </button>
            <button onclick="window.enterSection('play-alone')" class="hub-sub-btn" style="border-left: 4px solid var(--yellow);">
                <span style="font-size:1.5rem;">👤</span>
                <div style="text-align:left;">
                    <div style="font-size:0.8rem; color:#888;">SOLO MODE</div>
                    <div>My Backlog</div>
                </div>
            </button>
            <button onclick="window.resetHub()" style="background:transparent; border:none; color:#666; padding:10px; cursor:pointer;">« Back</button>
        </div>
    </div>

    <header>
        <button class="home-btn" onclick="window.handleHomeClick()">🏠</button>
        <h1 id="appTitle">Our Watchlist</h1>
    </header>

    <div class="controls">
        <button class="btn-roulette" onclick="window.startRoulette()">🎲 Spin the Wheel</button>
        
        <div class="filter-scroll" id="categoryChips"></div>

        <div class="dropdown-row">
            <div class="select-wrapper">
                <select id="statusFilter" onchange="window.updateUI()"></select>
            </div>
            <div class="select-wrapper">
                <select id="genreFilter" onchange="window.updateUI()">
                    <option value="all">Genre: All</option>
                </select>
            </div>
            <div class="select-wrapper">
                <select id="sortOrder" onchange="window.updateUI()">
                    <option value="default">Sort: Default</option>
                    <option value="year">Date: Newest</option>
                    <option value="imdb">Rating: High</option>
                    <option value="az">A-Z</option>
                </select>
            </div>
        </div>
    </div>

    <div id="mainContent"></div>

    <button id="addBtnFloat" class="add-float-btn" onclick="document.getElementById('addModal').style.display='flex'">+</button>

    <div class="modal-overlay" id="infoModal">
        <button class="close-btn-float" onclick="window.closeModal(event)">✕</button>
        <div class="nav-zone nav-left" onclick="window.navigateModal(-1)"></div>
        <div class="nav-zone nav-right" onclick="window.navigateModal(1)"></div>
        <div class="info-card" id="infoCard">
            <div class="info-hero" id="mHero"></div>
            <div class="info-content">
                <div class="info-title" id="mTitle"></div>
                <div class="info-tags" id="mTags"></div>
                <div class="info-desc" id="mDesc"></div>
                <div id="mNoteBox" style="display:none;"><div class="info-note" id="mNote"></div></div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="rouletteModal">
        <div style="text-align:center; width: 100%;">
            <h2 style="color:var(--gold); text-transform:uppercase; margin-bottom:20px; font-weight:800; letter-spacing:2px;">Rolling...</h2>
            <div class="roulette-wrapper">
                <div class="r-line"></div>
                <div class="roulette-track" id="rTrack"></div>
            </div>
            <h1 id="rWinner" style="color:white; margin-top:25px; opacity:0; transition:0.5s; font-size: 1.5rem;">???</h1>
            <button class="chip" style="margin-top:25px; padding: 12px 40px; background: #333; color: white; border:none;" onclick="document.getElementById('rouletteModal').style.display='none'">Close</button>
        </div>
    </div>

    <div class="modal-overlay" id="loginModal" onclick="window.closeModal(event)">
        <div class="form-box" onclick="event.stopPropagation()">
            <h2>Admin Login</h2>
            <input type="email" id="loginEmail" class="form-input" placeholder="Email" value="admin@ourhub.com">
            <input type="password" id="loginPass" class="form-input" placeholder="Password">
            <button class="form-btn" onclick="window.submitLogin()">Login</button>
        </div>
    </div>

    <div class="modal-overlay" id="addModal" onclick="window.closeModal(event)">
        <div class="form-box" onclick="event.stopPropagation()">
            <h2>Add New</h2>
            <div class="select-wrapper" style="margin-bottom:12px;">
                <select id="addType" class="form-input" style="margin:0;">
                    <option value="watch">Watchlist</option>
                    <option value="together">Game (Together)</option>
                    <option value="alone">Game (Alone)</option>
                </select>
            </div>
            <input type="text" id="addCat" class="form-input" placeholder="Category (MOVIE, RPG, SHOW, etc.)">
            <input type="text" id="addTitle" class="form-input" placeholder="Title">
            <input type="number" id="addYear" class="form-input" placeholder="Year (e.g. 2024)">
            
            <div style="display:flex; gap:10px; margin-bottom:12px;">
                <div class="select-wrapper">
                    <select id="addMe" class="form-input" style="margin:0;">
                        <option value="new">My Status: New</option>
                        <option value="note">My Status: Playing/Note</option>
                        <option value="done">My Status: Done</option>
                    </select>
                </div>
                <div class="select-wrapper">
                    <select id="addHer" class="form-input" style="margin:0;">
                        <option value="new">Her Status: New</option>
                        <option value="note">Her Status: Playing/Note</option>
                        <option value="done">Her Status: Done</option>
                    </select>
                </div>
            </div>
            
            <input type="number" step="0.1" id="addImdb" class="form-input" placeholder="Rating (e.g. 8.5)">
            <input type="text" id="addTags" class="form-input" placeholder="Tags (comma separated)">
            <input type="text" id="addImage" class="form-input" placeholder="Image URL">
            <textarea id="addDesc" class="form-input" placeholder="Description" rows="3" style="resize:none;"></textarea>
            <input type="text" id="addNote" class="form-input" placeholder="Personal Note (optional)">
            
            <button class="form-btn" id="saveItemBtn" onclick="window.submitAddItem()">Save Item</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC9KrLCdD_UXrz3EyT0KodSD27hd60VTGM",
            authDomain: "our-hub-513cb.firebaseapp.com",
            projectId: "our-hub-513cb",
            storageBucket: "our-hub-513cb.firebasestorage.app",
            messagingSenderId: "1044308960028",
            appId: "1:1044308960028:web:4672375eb04fc0740c50d9"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let watchList = [];
        let gamesTogether = [];
        let gamesAlone = [];
        let currentList = [];
        let currentCategory = 'all';
        let currentModalList = [];
        let currentModalIndex = 0;
        let currentMode = 'watch'; 

        let homeClicks = 0;
        let homeClickTimer;

        onAuthStateChanged(auth, (user) => {
            if (user && !user.isAnonymous) {
                document.getElementById('addBtnFloat').style.display = 'flex';
                document.getElementById('loginModal').style.display = 'none';
            } else {
                document.getElementById('addBtnFloat').style.display = 'none';
            }
        });

        async function initApp() {
            try {
                await signInAnonymously(auth);
            } catch (error) {
                console.log("Not using anonymous login, waiting for user auth.");
            }
            fetchData();
        }

        function fetchData() {
            const mediaCollection = collection(db, 'artifacts', 'our-hub', 'public', 'data', 'media');
            
            onSnapshot(mediaCollection, (snapshot) => {
                watchList = [];
                gamesTogether = [];
                gamesAlone = [];

                snapshot.forEach((doc) => {
                    const data = doc.data();
                    const item = { ...data, id: doc.id };
                    
                    if (data.type === 'watch') watchList.push(item);
                    else if (data.type === 'together') gamesTogether.push(item);
                    else if (data.type === 'alone') gamesAlone.push(item);
                });

                document.getElementById('loadingScreen').style.display = 'none';
                
                if (document.getElementById('hubScreen').style.display === 'none') {
                    window.enterSection(currentMode, true); 
                } else {
                    document.getElementById('hubScreen').style.display = 'flex';
                }
            }, (error) => {
                console.error("Error fetching data:", error);
                document.getElementById('loadingText').innerText = "Error loading database. Please check rules.";
            });
        }

        window.handleHomeClick = () => {
            homeClicks++;
            clearTimeout(homeClickTimer);
            homeClickTimer = setTimeout(() => { homeClicks = 0; }, 1500);
            
            if (homeClicks >= 3) {
                homeClicks = 0;
                document.getElementById('loginModal').style.display = 'flex';
            } else {
                window.goHome();
            }
        };

        window.submitLogin = async () => {
            const email = document.getElementById('loginEmail').value;
            const pass = document.getElementById('loginPass').value;
            try {
                await signInWithEmailAndPassword(auth, email, pass);
                alert("Logged in successfully!");
            } catch (error) {
                alert("Login failed: " + error.message);
            }
        };

        window.submitAddItem = async () => {
            const btn = document.getElementById('saveItemBtn');
            btn.innerText = "Saving...";
            btn.disabled = true;

            const parseStatus = (val) => {
                if(val === 'done') return true;
                if(val === 'new') return false;
                return 'note';
            };

            const newItem = {
                type: document.getElementById('addType').value,
                category: document.getElementById('addCat').value.toUpperCase().trim(),
                title: document.getElementById('addTitle').value.trim(),
                year: parseInt(document.getElementById('addYear').value) || 0,
                me: parseStatus(document.getElementById('addMe').value),
                her: parseStatus(document.getElementById('addHer').value),
                imdb: parseFloat(document.getElementById('addImdb').value) || 0,
                tags: document.getElementById('addTags').value.trim(),
                image: document.getElementById('addImage').value.trim(),
                desc: document.getElementById('addDesc').value.trim(),
                note: document.getElementById('addNote').value.trim(),
                timestamp: Date.now() 
            };

            try {
                const mediaCollection = collection(db, 'artifacts', 'our-hub', 'public', 'data', 'media');
                await addDoc(mediaCollection, newItem);
                
                document.getElementById('addTitle').value = "";
                document.getElementById('addImage').value = "";
                document.getElementById('addDesc').value = "";
                document.getElementById('addNote').value = "";
                
                document.getElementById('addModal').style.display = 'none';
            } catch (error) {
                alert("Error saving: " + error.message);
            }

            btn.innerText = "Save Item";
            btn.disabled = false;
        };

        window.showGameOptions = () => {
            document.querySelectorAll('.hub-btn').forEach(b => b.style.display = 'none');
            document.getElementById('gameSubMenu').style.display = 'flex';
        };

        window.resetHub = () => {
            document.querySelectorAll('.hub-btn').forEach(b => b.style.display = 'block');
            document.getElementById('gameSubMenu').style.display = 'none';
        };

        window.goHome = () => {
            document.getElementById('hubScreen').style.display = 'flex';
            window.resetHub();
        };

        window.enterSection = (mode, isRefresh = false) => {
            currentMode = mode;
            document.getElementById('hubScreen').style.display = 'none';

            const statusSel = document.getElementById('statusFilter');
            if(!isRefresh) statusSel.innerHTML = "";

            if (mode === 'watch') {
                currentList = watchList;
                document.getElementById('appTitle').innerText = "Our Watchlist";
                document.querySelector('.btn-roulette').style.background = "linear-gradient(135deg, #ff4b4b, #e50914)";
                if(!isRefresh) {
                    statusSel.innerHTML += `<option value="all">Status: All</option><option value="new">✨ New</option><option value="note">⚠️ Note</option><option value="done">✅ Done</option>`;
                }
            } else if (mode === 'play-together') {
                currentList = gamesTogether;
                document.getElementById('appTitle').innerText = "Games: Together";
                document.querySelector('.btn-roulette').style.background = "linear-gradient(135deg, #ff69b4, #e056fd)";
                if(!isRefresh) {
                    statusSel.innerHTML += `<option value="all">Status: All</option><option value="new">✨ New</option><option value="note">⚠️ Note</option>`;
                }
            } else {
                currentList = gamesAlone;
                document.getElementById('appTitle').innerText = "My Backlog";
                document.querySelector('.btn-roulette').style.background = "linear-gradient(135deg, #fdd835, #f0932b)";
                if(!isRefresh) {
                    statusSel.innerHTML += `<option value="all">Status: All</option><option value="new">✨ New</option><option value="note">⚠️ Note</option><option value="done">🏆 Played</option>`;
                }
            }

            if(!isRefresh) {
                currentCategory = 'all';
                document.getElementById('statusFilter').value = 'all';
                document.getElementById('sortOrder').value = 'default';
            }
            
            updateCategoryChips();
            populateGenres();
            window.updateUI();
        };

        function getStatusInfo(me, her) {
            if (currentMode === 'watch') {
                if (me === false && her === false) return { text: "New", class: "s-new", dot: "d-new", code: "new" };
                if (me === true && her === true) return { text: "Done", class: "s-done", dot: "d-done", code: "done" };
                return { text: "Note", class: "s-note", dot: "d-note", code: "note" };
            }
            if (currentMode === 'play-together') {
                if (me === false && her === false) return { text: "New", class: "s-new", dot: "d-new", code: "new" };
                return { text: "Note", class: "s-note", dot: "d-note", code: "note" };
            }
            if (currentMode === 'play-alone') {
                if (me === true) return { text: "Played", class: "s-done", dot: "d-done", code: "done" };
                if (me === false) return { text: "New", class: "s-new", dot: "d-new", code: "new" };
                return { text: "Note", class: "s-note", dot: "d-note", code: "note" };
            }
            return { text: "Unknown", class: "s-note", dot: "d-note", code: "note" };
        }

        function updateCategoryChips() {
            const container = document.getElementById('categoryChips');
            container.innerHTML = `<div class="chip ${currentCategory === 'all' ? 'active' : ''}" onclick="window.setFilter('all', this)">All</div>`;
            
            const uniqueCats = [...new Set(currentList.map(i => i.category))].sort();
            
            if (currentMode === 'watch') {
                const priority = ["ANIME", "MOVIE", "SHOW", "YOUTUBE"];
                priority.forEach(cat => {
                    if (uniqueCats.includes(cat) && cat !== "") {
                        container.innerHTML += `<div class="chip ${currentCategory === cat ? 'active' : ''}" onclick="window.setFilter('${cat}', this)">${prettyCat(cat)}</div>`;
                    }
                });
            } else {
                uniqueCats.forEach(cat => {
                    if (cat !== "") {
                        container.innerHTML += `<div class="chip ${currentCategory === cat ? 'active' : ''}" onclick="window.setFilter('${cat}', this)">${prettyCat(cat)}</div>`;
                    }
                });
            }
        }

        function prettyCat(cat) {
            if (cat === 'ANIME') return 'Anime';
            if (cat === 'MOVIE') return 'Movies';
            if (cat === 'SHOW') return 'Shows';
            if (cat === 'YOUTUBE') return 'YouTube';
            return cat.charAt(0).toUpperCase() + cat.slice(1).toLowerCase();
        }

        window.setFilter = (cat, btn) => {
            currentCategory = cat;
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            btn.classList.add('active');
            window.updateUI();
        };

        function populateGenres() {
            const currentFilter = document.getElementById('genreFilter').value;
            const allTags = new Set();
            currentList.forEach(item => {
                if (item.tags) item.tags.split(',').forEach(tag => allTags.add(tag.trim()));
            });
            const sortedTags = Array.from(allTags).sort();
            const genreSelect = document.getElementById('genreFilter');
            genreSelect.innerHTML = '<option value="all">Genre: All</option>';
            sortedTags.forEach(tag => {
                const option = document.createElement('option');
                option.value = tag;
                option.innerText = tag;
                if(tag === currentFilter) option.selected = true;
                genreSelect.appendChild(option);
            });
        }

        window.updateUI = () => {
            const main = document.getElementById('mainContent');
            const statusFilter = document.getElementById('statusFilter').value;
            const sortOrder = document.getElementById('sortOrder').value;
            const genreFilter = document.getElementById('genreFilter').value; 

            main.innerHTML = "";

            let filtered = currentList.filter(item => {
                const s = getStatusInfo(item.me, item.her);
                if (statusFilter !== 'all' && s.code !== statusFilter) return false;
                if (currentCategory !== 'all' && !item.category.includes(currentCategory)) return false;
                if (genreFilter !== 'all') {
                    if (!item.tags || !item.tags.includes(genreFilter)) return false;
                }
                return true;
            }).sort((a, b) => {
                if (sortOrder === 'imdb') return (b.imdb || 0) - (a.imdb || 0);
                if (sortOrder === 'year') return (b.year || 0) - (a.year || 0);
                if (sortOrder === 'az') return a.title.localeCompare(b.title);
                return (b.timestamp || 0) - (a.timestamp || 0); 
            });

            if (filtered.length === 0) {
                main.innerHTML = "<div style='text-align:center; padding:50px; color:#555;'>Nothing found 😔</div>";
                return;
            }

            if (currentCategory === 'all') {
                const categoriesInView = [...new Set(filtered.map(i => i.category))];
                if (currentMode === 'watch') {
                    const order = ["ANIME", "MOVIE", "SHOW", "YOUTUBE"];
                    order.forEach(cat => {
                        let rowItems = filtered.filter(i => i.category === cat);
                        if (rowItems.length > 0) renderRow(prettyCat(cat), rowItems, main);
                    });
                } else {
                    categoriesInView.sort().forEach(cat => {
                        if(cat !== ""){
                            let rowItems = filtered.filter(i => i.category === cat);
                            renderRow(prettyCat(cat), rowItems, main);
                        }
                    });
                }
            } 
            else {
                let franchiseItems = filtered.filter(i => i.group);
                let singularItems = filtered.filter(i => !i.group);

                if (singularItems.length > 0) renderRow('Library', singularItems, main, true); 

                if (franchiseItems.length > 0) {
                    const visibleGroups = Array.from(new Set(franchiseItems.map(i => i.group)));
                    visibleGroups.forEach(groupName => {
                        let groupItems = franchiseItems
                            .filter(i => i.group === groupName)
                            .sort((a, b) => sortOrder === 'default' ? (a.chronology || 999) - (b.chronology || 999) : 0); 
                        if (groupItems.length > 0) renderRow(groupName, groupItems, main);
                    });
                }
            }
        };

        function renderRow(title, items, mainElement, useRow = true) {
            const wrapper = document.createElement('div');
            const header = document.createElement('div');
            header.className = 'section-header';
            
            const titleDiv = document.createElement('div');
            titleDiv.className = 'section-title';
            titleDiv.innerText = title;
            header.appendChild(titleDiv);

            if (useRow) {
                const arrowsDiv = document.createElement('div');
                arrowsDiv.className = 'scroll-arrows';
                arrowsDiv.innerHTML = `<button class="arrow-btn" onclick="window.scrollRow(this, -1)">‹</button><button class="arrow-btn" onclick="window.scrollRow(this, 1)">›</button>`;
                header.appendChild(arrowsDiv);
            }

            const content = document.createElement('div');
            content.className = useRow ? 'row-container' : 'grid-container';
            
            items.forEach(item => content.appendChild(createCard(item, items)));

            if (useRow) {
                wrapper.appendChild(header);
                wrapper.appendChild(content);
                mainElement.appendChild(wrapper);
            } else {
                mainElement.appendChild(header);
                mainElement.appendChild(content);
            }
        }

        window.scrollRow = (btn, direction) => {
            const wrapper = btn.closest('div').parentElement.parentElement;
            const container = wrapper.querySelector('.row-container');
            if (container) {
                const scrollAmount = container.clientWidth * 0.8;
                container.scrollBy({ left: scrollAmount * direction, behavior: 'smooth' });
            }
        };

        function createCard(item, sourceList) {
            const el = document.createElement('div');
            const s = getStatusInfo(item.me, item.her);
            el.className = `card ${s.code === 'done' ? 'dimmed' : ''}`;
            el.onclick = () => window.openModal(item, sourceList);
            
            const badge = item.imdb > 0 ? `<div class="imdb-badge">⭐ ${item.imdb}</div>` : '';
            const bgImage = item.image && item.image.includes('http') ? item.image : 'https://placehold.co/300x450?text=No+Image';
            
            const isYT = item.category === 'YOUTUBE' && item.title.includes('Random');
            const style = isYT ? `background-image: url('${bgImage}'); background-size: 80%; background-repeat: no-repeat; background-color: #ff0000;` : `background-image: url('${bgImage}')`;

            el.innerHTML = `
                <div class="card-image" style="${style}"></div>
                ${badge}
                <div class="card-overlay">
                    <div class="card-title">${item.title}</div>
                    <div class="card-status"><span class="status-dot ${s.dot}"></span><span class="${s.class}">${s.text}</span></div>
                </div>
            `;
            return el;
        }

        window.openModal = (item, list) => {
            currentModalList = list;
            currentModalIndex = list.indexOf(item);
            renderModalContent();
            document.getElementById('infoModal').style.display = 'flex';
        };

        window.navigateModal = (direction) => {
            const newIndex = currentModalIndex + direction;
            if (newIndex >= 0 && newIndex < currentModalList.length) {
                currentModalIndex = newIndex;
                renderModalContent();
            }
        };

        function renderModalContent() {
            const item = currentModalList[currentModalIndex];
            const s = getStatusInfo(item.me, item.her);
            const isYT = item.category === 'YOUTUBE' && item.title.includes('Random');
            const bgImage = item.image && item.image.includes('http') ? item.image : 'https://placehold.co/300x450?text=No+Image';
            const heroStyle = isYT ? `background-image: url('${bgImage}'); background-size: 30%; background-repeat: no-repeat; background-color: #ff0000;` : `background-image: url('${bgImage}')`;

            document.getElementById('mHero').style.cssText = heroStyle;
            document.getElementById('mTitle').innerText = item.title;
            
            let catText = item.group ? item.group : prettyCat(item.category);
            const tagsHtml = item.tags ? item.tags.split(',').map(tag => `<span class="tag-pill">${tag.trim()}</span>`).join('') : '';

            document.getElementById('mTags').innerHTML = `
                <span class="${s.class}" style="font-weight:bold;">${s.text}</span> • ${catText} ${item.year > 0 ? '• ' + item.year : ''} ${item.imdb > 0 ? `• ⭐ ${item.imdb}` : ''}<br><br>${tagsHtml}
            `;
            document.getElementById('mDesc').innerText = item.desc;
            
            const noteBox = document.getElementById('mNoteBox');
            if (item.note) {
                noteBox.style.display = 'block';
                document.getElementById('mNote').innerText = item.note;
            } else {
                noteBox.style.display = 'none';
            }
        }

        window.closeModal = (e) => {
            if (!e || e.target.classList.contains('modal-overlay') || e.target.classList.contains('close-btn-float')) {
                document.querySelectorAll('.modal-overlay').forEach(m => m.style.display = 'none');
            }
        };

        let touchstartX = 0;
        let touchendX = 0;
        const infoModalEl = document.getElementById('infoModal');
        infoModalEl.addEventListener('touchstart', e => touchstartX = e.changedTouches[0].screenX);
        infoModalEl.addEventListener('touchend', e => {
            touchendX = e.changedTouches[0].screenX;
            if (touchendX < touchstartX - 50) window.navigateModal(1);
            if (touchendX > touchstartX + 50) window.navigateModal(-1);
        });

        window.startRoulette = () => {
            const statusFilter = document.getElementById('statusFilter').value;
            const genreFilter = document.getElementById('genreFilter').value;

            const candidates = currentList.filter(i => {
                const s = getStatusInfo(i.me, i.her).code;
                const matchesStatus = statusFilter === 'all' ? s !== 'done' : s === statusFilter;
                const validStatus = statusFilter === 'done' ? true : s !== 'done'; 
                const matchesGenre = genreFilter === 'all' || (i.tags && i.tags.includes(genreFilter));
                const matchesCat = currentCategory === 'all' || i.category.includes(currentCategory);
                return matchesCat && matchesStatus && matchesGenre && validStatus;
            });
            
            if (candidates.length === 0) { alert("Nothing found to roll! (✧ω✧)"); return; }

            document.getElementById('rouletteModal').style.display = 'flex';
            document.getElementById('rWinner').style.opacity = '0';
            const track = document.getElementById('rTrack');
            track.innerHTML = "";
            track.style.transition = 'none';
            track.style.transform = 'translateX(0)';
            
            const total = 50;
            const winIdx = 40;
            const winner = candidates[Math.floor(Math.random() * candidates.length)];
            
            for(let i=0; i<total; i++) {
                const it = (i===winIdx) ? winner : candidates[Math.floor(Math.random() * candidates.length)];
                const d = document.createElement('div');
                d.className = 'r-card';
                const bgImg = it.image && it.image.includes('http') ? it.image : 'https://placehold.co/300x450?text=No+Image';
                d.style.backgroundImage = `url('${bgImg}')`;
                track.appendChild(d);
            }

            setTimeout(() => {
                const cardW = 130;
                const offset = -((winIdx * cardW) + (cardW/2) - (track.parentElement.offsetWidth / 2));
                const jitter = Math.floor(Math.random()*20) - 10;
                track.style.transition = 'transform 4.5s cubic-bezier(0.1, 0, 0.2, 1)';
                track.style.transform = `translateX(${offset + jitter}px)`;
                setTimeout(() => {
                    document.getElementById('rWinner').innerText = winner.title;
                    document.getElementById('rWinner').style.opacity = '1';
                    setTimeout(() => { window.openModal(winner, candidates); document.getElementById('rouletteModal').style.display = 'none'; }, 1500);
                }, 4500);
            }, 50);
        };

        initApp();

    </script>
</body>
</html>

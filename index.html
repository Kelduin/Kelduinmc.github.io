<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEXUS | Our Hub</title>
    
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

    <style>
        /* --- DESIGN TOKENS --- */
        :root {
            --bg-deep: #050505;
            --bg-surface: #0a0a0a;
            --glass-panel: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --blur: 16px;
            
            --neon-cyan: #00f3ff;
            --neon-magenta: #bd00ff;
            --neon-green: #39ff14;
            --neon-gold: #ffd700;
            
            --ease-elastic: cubic-bezier(0.175, 0.885, 0.32, 1.275);
            --grid-min: 160px;
        }

        /* --- BASE --- */
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            background-color: var(--bg-deep);
            color: #fff;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(189, 0, 255, 0.04), transparent 30%),
                radial-gradient(circle at 85% 30%, rgba(0, 243, 255, 0.04), transparent 30%);
            overflow-x: hidden;
        }

        /* --- HUB SCREEN (LANDING) --- */
        #hubScreen {
            position: fixed; inset: 0; z-index: 2000;
            background: var(--bg-deep);
            display: flex; flex-direction: column; 
            align-items: center; justify-content: center; gap: 2rem;
            transition: opacity 0.5s ease;
        }
        
       .hub-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 3rem; font-weight: 700;
            background: linear-gradient(to right, #fff, #999);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 2rem; text-transform: uppercase; letter-spacing: -1px;
        }

       .hub-options { display: flex; gap: 2rem; flex-wrap: wrap; justify-content: center; width: 100%; max-width: 800px; }

       .hub-card {
            background: var(--glass-panel);
            border: 1px solid var(--glass-border);
            padding: 3rem 2rem;
            border-radius: 24px;
            width: 280px;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s var(--ease-elastic);
            position: relative; overflow: hidden;
        }

       .hub-card:hover { transform: translateY(-10px); border-color: var(--active-color); box-shadow: 0 0 30px var(--glow-color); }
       .hub-card i { display: block; margin: 0 auto 1.5rem; transition: transform 0.3s; }
       .hub-card:hover i { transform: scale(1.2); }
       .hub-label { font-family: 'Space Grotesk'; font-size: 1.5rem; font-weight: 700; }

        /* --- APP HEADER --- */
        header {
            position: sticky; top: 0; z-index: 100;
            background: rgba(5, 5, 5, 0.85);
            backdrop-filter: blur(var(--blur));
            border-bottom: 1px solid var(--glass-border);
            padding: 1rem 1.5rem;
            display: flex; align-items: center; justify-content: space-between;
        }

       .app-brand { 
            font-family: 'Space Grotesk'; font-weight: 700; font-size: 1.25rem; 
            display: flex; align-items: center; gap: 10px; cursor: pointer;
        }

       .nav-actions { display: flex; gap: 10px; }

        /* --- CONTROLS & FILTERS --- */
       .controls {
            padding: 1.5rem;
            display: flex; flex-direction: column; gap: 1.5rem;
        }

       .roulette-btn {
            background: linear-gradient(135deg, var(--bg-surface), var(--bg-deep));
            border: 1px solid var(--glass-border);
            color: var(--neon-gold);
            padding: 1rem; border-radius: 12px;
            font-weight: 700; text-transform: uppercase; letter-spacing: 1px;
            cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
       .roulette-btn:hover { border-color: var(--neon-gold); box-shadow: 0 0 20px rgba(255, 215, 0, 0.2); }

       .filter-row {
            display: flex; gap: 10px; overflow-x: auto; padding-bottom: 5px;
            scrollbar-width: none;
        }
       .filter-row::-webkit-scrollbar { display: none; }

       .chip {
            background: var(--glass-panel); border: 1px solid var(--glass-border);
            padding: 8px 16px; border-radius: 50px;
            font-size: 0.85rem; color: #aaa; white-space: nowrap; cursor: pointer;
            transition: all 0.2s;
        }
       .chip.active { background: #fff; color: #000; border-color: #fff; font-weight: 600; }
       .chip:hover:not(.active) { border-color: #666; color: #fff; }

        /* --- GRID LAYOUT --- */
       .grid {
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(var(--grid-min), 1fr));
            gap: 1.5rem; padding: 0 1.5rem 4rem;
        }

       .card {
            position: relative; aspect-ratio: 2/3;
            background: var(--bg-surface); border-radius: 12px; overflow: hidden;
            cursor: pointer; transition: transform 0.3s var(--ease-elastic);
            will-change: transform;
        }
       .card:hover { transform: scale(1.05); z-index: 10; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
       .card.dimmed { opacity: 0.3; filter: grayscale(1); }

       .card img { width: 100%; height: 100%; object-fit: cover; }
        
       .card-overlay {
            position: absolute; inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent 60%);
            display: flex; flex-direction: column; justify-content: flex-end; padding: 1rem;
            opacity: 0; transition: 0.3s;
        }
       .card:hover.card-overlay { opacity: 1; }

        /* Mobile overrides for hover */
        @media(hover: none) {
           .card-overlay { opacity: 1; background: linear-gradient(to top, rgba(0,0,0,0.9), transparent 40%); }
        }

       .card-title { font-weight: 700; font-size: 0.95rem; line-height: 1.2; margin-bottom: 4px; }
       .card-meta { font-size: 0.75rem; color: #ccc; display: flex; gap: 6px; align-items: center; }
       .status-dot { width: 6px; height: 6px; border-radius: 50%; }

        /* Status Colors */
       .st-new { color: var(--neon-green); }.bg-new { background: var(--neon-green); }
       .st-note { color: var(--neon-gold); }.bg-note { background: var(--neon-gold); }
       .st-done { color: #555; }.bg-done { background: #555; }

        /* --- MODALS --- */
        dialog {
            background: #111; color: #fff; border: 1px solid var(--glass-border);
            border-radius: 16px; padding: 0; width: 90%; max-width: 500px;
            margin: auto; box-shadow: 0 0 50px rgba(0,0,0,0.8);
        }
        dialog::backdrop { background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); }

        /* Details Modal */
       .modal-hero { height: 200px; background-size: cover; position: relative; }
       .modal-hero::after { content:''; position: absolute; inset: 0; background: linear-gradient(to top, #111, transparent); }
       .modal-content { padding: 1.5rem; position: relative; }
       .modal-close { 
            position: absolute; top: 1rem; right: 1rem; 
            background: rgba(0,0,0,0.5); border: none; color: #fff; 
            width: 32px; height: 32px; border-radius: 50%; cursor: pointer; 
            z-index: 10; display: flex; align-items: center; justify-content: center;
        }
       .tag { background: #222; padding: 4px 10px; border-radius: 4px; font-size: 0.75rem; color: #999; }
       .note-box { background: rgba(255, 215, 0, 0.1); border-left: 3px solid var(--neon-gold); padding: 10px; margin-top: 15px; font-size: 0.9rem; color: #ddd; }

        /* Add Form */
       .form-group { margin-bottom: 1rem; }
       .form-input { 
            width: 100%; background: #222; border: 1px solid #333; color: #fff;
            padding: 10px; border-radius: 8px; font-family: inherit;
        }
       .form-input:focus { border-color: var(--neon-cyan); outline: none; }
       .btn-submit { 
            width: 100%; padding: 12px; background: var(--neon-cyan); border: none;
            border-radius: 8px; font-weight: 700; cursor: pointer; color: #000;
        }

        /* Roulette */
       .roulette-track { display: flex; height: 150px; border: 2px solid var(--neon-gold); overflow: hidden; position: relative; border-radius: 12px; background: #000; }
       .r-strip { display: flex; height: 100%; transition: transform 4s cubic-bezier(0.1, 0, 0.1, 1); }
       .r-item { width: 120px; height: 100%; background-size: cover; flex-shrink: 0; border-right: 1px solid #222; }
       .r-line { position: absolute; left: 50%; top: 0; bottom: 0; width: 4px; background: var(--neon-gold); z-index: 10; transform: translateX(-50%); box-shadow: 0 0 10px var(--neon-gold); }
    </style>
</head>
<body>

    <div id="hubScreen">
        <h1 class="hub-title">Nexus Hub</h1>
        <div class="hub-options">
            <div class="hub-card" onclick="app.init('watch')" style="--active-color: var(--neon-cyan); --glow-color: rgba(0, 243, 255, 0.3)">
                <i data-lucide="clapperboard" size="48" color="#00f3ff"></i>
                <div class="hub-label" style="color:#00f3ff">Watch</div>
                <div style="color:#666; font-size:0.9rem; margin-top:5px;">Movies & Shows</div>
            </div>
            
            <div class="hub-card" onclick="app.init('play-together')" style="--active-color: var(--neon-magenta); --glow-color: rgba(189, 0, 255, 0.3)">
                <i data-lucide="gamepad-2" size="48" color="#bd00ff"></i>
                <div class="hub-label" style="color:#bd00ff">Co-op</div>
                <div style="color:#666; font-size:0.9rem; margin-top:5px;">Play Together</div>
            </div>

            <div class="hub-card" onclick="app.init('play-alone')" style="--active-color: var(--neon-green); --glow-color: rgba(57, 255, 20, 0.3)">
                <i data-lucide="user" size="48" color="#39ff14"></i>
                <div class="hub-label" style="color:#39ff14">Solo</div>
                <div style="color:#666; font-size:0.9rem; margin-top:5px;">My Backlog</div>
            </div>
        </div>
    </div>

    <div id="app" style="display: none;">
        <header>
            <div class="app-brand" onclick="location.reload()">
                <i data-lucide="chevron-left"></i> <span id="headerTitle">Library</span>
            </div>
            <div class="nav-actions">
                <button class="chip" onclick="app.openAddModal()" style="background: var(--neon-cyan); color: #000; border:none; font-weight:bold;">+ Add</button>
            </div>
        </header>

        <div class="controls">
            <button class="roulette-btn" onclick="app.spinRoulette()">
                <i data-lucide="dices"></i> Spin the Wheel
            </button>
            
            <div class="filter-row" id="filterContainer"></div>
        </div>

        <div class="grid" id="grid"></div>
    </div>

    <dialog id="detailModal">
        <button class="modal-close" onclick="document.getElementById('detailModal').close()">✕</button>
        <div class="modal-hero" id="mHero"></div>
        <div class="modal-content">
            <h2 id="mTitle" style="font-family:'Space Grotesk'; font-size:1.5rem; margin-bottom:10px;"></h2>
            <div style="display:flex; flex-wrap:wrap; gap:5px; margin-bottom:15px;" id="mTags"></div>
            <p id="mDesc" style="color:#ccc; line-height:1.6; font-size:0.95rem;"></p>
            <div id="mNote" class="note-box" style="display:none"></div>
        </div>
    </dialog>

    <dialog id="rouletteModal" style="background:transparent; box-shadow:none; border:none;">
        <div style="text-align:center; padding: 20px;">
            <div class="roulette-track">
                <div class="r-strip" id="rStrip"></div>
                <div class="r-line"></div>
            </div>
            <h1 id="rResult" style="margin-top:20px; font-family:'Space Grotesk'; opacity:0; transition:0.5s; text-shadow:0 0 20px black;">Winner!</h1>
            <button onclick="document.getElementById('rouletteModal').close()" style="margin-top:20px; padding:10px 30px; background:#333; color:#fff; border:none; border-radius:20px; cursor:pointer;">Close</button>
        </div>
    </dialog>

    <dialog id="addModal">
        <div style="padding:20px;">
            <h2 style="margin-bottom:20px; font-family:'Space Grotesk'">Add New Entry</h2>
            <form id="addForm" onsubmit="app.handleAdd(event)">
                <div class="form-group">
                    <input class="form-input" name="title" placeholder="Title" required>
                </div>
                <div class="form-group">
                    <input class="form-input" name="image" placeholder="Image URL" required>
                </div>
                <div class="form-group" style="display:flex; gap:10px;">
                    <input class="form-input" name="year" type="number" placeholder="Year" style="flex:1">
                    <input class="form-input" name="imdb" type="number" step="0.1" placeholder="Rating" style="flex:1">
                </div>
                <div class="form-group">
                    <input class="form-input" name="tags" placeholder="Tags (comma separated)">
                </div>
                <div class="form-group">
                    <input class="form-input" name="note" placeholder="Note (Optional)">
                </div>
                <button type="submit" class="btn-submit">Generate JSON & Copy</button>
            </form>
        </div>
    </dialog>

    <script src="data.js"></script>
    <script>
        const app = {
            data:,
            mode: '',
            filter: 'All',

            init: (mode) => {
                app.mode = mode;
                document.getElementById('hubScreen').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('hubScreen').style.display = 'none';
                    document.getElementById('app').style.display = 'block';
                }, 500);

                // Load correct list based on user selection
                if(mode === 'watch') app.data = watchList;
                else if(mode === 'play-together') app.data = gamesTogether;
                else app.data = gamesAlone;

                document.getElementById('headerTitle').innerText = mode === 'watch'? 'Watchlist' : (mode === 'play-together'? 'Co-op Games' : 'Solo Backlog');
                
                app.renderFilters();
                app.renderGrid();
                lucide.createIcons();
            },

            getStatus: (item) => {
                // Logic derived from your original code
                const { me, her } = item;
                if(app.mode === 'watch') {
                    if(!me &&!her) return { text:'New', color:'st-new', dot:'bg-new', code:'new' };
                    if(me && her) return { text:'Done', color:'st-done', dot:'bg-done', code:'done' };
                    return { text:'Note', color:'st-note', dot:'bg-note', code:'note' };
                }
                // Games
                if(app.mode === 'play-alone') {
                    if(me === true) return { text:'Played', color:'st-done', dot:'bg-done', code:'done' };
                    if(me === false) return { text:'New', color:'st-new', dot:'bg-new', code:'new' };
                    return { text:'Note', color:'st-note', dot:'bg-note', code:'note' };
                }
                // Together
                if(!me &&!her) return { text:'New', color:'st-new', dot:'bg-new', code:'new' };
                return { text:'Note', color:'st-note', dot:'bg-note', code:'note' };
            },

            renderFilters: () => {
                const cats =.sort();
                const container = document.getElementById('filterContainer');
                container.innerHTML = cats.map(c => 
                    `<button class="chip ${c === 'All'? 'active' : ''}" onclick="app.setFilter('${c}', this)">${c}</button>`
                ).join('');
            },

            setFilter: (cat, btn) => {
                app.filter = cat;
                document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
                btn.classList.add('active');
                app.renderGrid();
            },

            renderGrid: () => {
                const grid = document.getElementById('grid');
                const filtered = app.data.filter(i => app.filter === 'All' |

| i.category === app.filter);
                
                grid.innerHTML = filtered.map((item, index) => {
                    const status = app.getStatus(item);
                    return `
                    <div class="card ${status.code === 'done'? 'dimmed' : ''}" onclick="app.openDetail(${index})">
                        <img src="${item.image |

| 'https://placehold.co/400x600/111/444?text=No+Image'}" loading="lazy">
                        <div class="card-overlay">
                            <div class="card-title">${item.title}</div>
                            <div class="card-meta">
                                <span class="status-dot ${status.dot}"></span>
                                <span class="${status.color}">${status.text}</span>
                                ${item.imdb? `• ⭐ ${item.imdb}` : ''}
                            </div>
                        </div>
                    </div>`;
                }).join('');
            },

            openDetail: (idx) => {
                // Find item in current filtered view or full list? 
                // Simple approach: find by title since we don't have IDs
                // Better: Pass the object directly if we were using React, but here index of filtered array is risky.
                // Let's just find the item in the main data array.
                // Actually, let's use the click handler properly. 
                // Re-finding strictly for this demo:
                const item = app.data.find(i => i.title === document.querySelectorAll('.card-title')[idx].innerText);
                if(!item) return;

                const d = document.getElementById('detailModal');
                const s = app.getStatus(item);
                
                document.getElementById('mHero').style.backgroundImage = `url('${item.image}')`;
                document.getElementById('mTitle').innerText = item.title;
                document.getElementById('mDesc').innerText = item.desc |

| "No description provided.";
                
                let tags = `<span class="tag" style="color:var(--neon-cyan)">${s.text}</span>`;
                if(item.year) tags += `<span class="tag">${item.year}</span>`;
                if(item.category) tags += `<span class="tag">${item.category}</span>`;
                if(item.tags) item.tags.split(',').forEach(t => tags += `<span class="tag">${t.trim()}</span>`);
                
                document.getElementById('mTags').innerHTML = tags;

                const noteEl = document.getElementById('mNote');
                if(item.note) {
                    noteEl.style.display = 'block';
                    noteEl.innerText = "Note: " + item.note;
                } else {
                    noteEl.style.display = 'none';
                }

                d.showModal();
            },

            spinRoulette: () => {
                // Filter eligible candidates (not done)
                const pool = app.data.filter(i => {
                    const s = app.getStatus(i);
                    return s.code!== 'done';
                });
                
                if(pool.length === 0) return alert("Nothing left to play/watch!");

                const modal = document.getElementById('rouletteModal');
                const strip = document.getElementById('rStrip');
                const resultText = document.getElementById('rResult');
                
                // Build Strip
                let html = '';
                const cardWidth = 120;
                const winsAt = 30; // Index of winner
                const total = 40;
                
                // Pick winner
                const winner = pool[Math.floor(Math.random() * pool.length)];

                for(let i=0; i<total; i++) {
                    const item = (i === winsAt)? winner : pool[Math.floor(Math.random() * pool.length)];
                    html += `<div class="r-item" style="background-image:url('${item.image}')"></div>`;
                }
                
                strip.innerHTML = html;
                strip.style.transition = 'none';
                strip.style.transform = 'translateX(0)';
                resultText.style.opacity = '0';
                
                modal.showModal();

                // Spin
                setTimeout(() => {
                    const centerOffset = (modal.clientWidth / 2); // approximate
                    const target = (winsAt * cardWidth) + (cardWidth / 2) - 150; // 150 is half track width
                    const jitter = Math.random() * 20;
                    
                    strip.style.transition = 'transform 4s cubic-bezier(0.1, 0, 0.1, 1)';
                    strip.style.transform = `translateX(-${target + jitter}px)`;
                    
                    setTimeout(() => {
                        resultText.innerText = winner.title;
                        resultText.style.opacity = '1';
                    }, 4000);
                }, 100);
            },

            openAddModal: () => document.getElementById('addModal').showModal(),

            handleAdd: (e) => {
                e.preventDefault();
                const f = new FormData(e.target);
                const newItem = {
                    category: app.filter === 'All'? 'MOVIE' : app.filter, // Default
                    title: f.get('title'),
                    image: f.get('image'),
                    year: parseInt(f.get('year')) |

| 0,
                    imdb: parseFloat(f.get('imdb')) |

| 0,
                    me: false, her: false,
                    tags: f.get('tags'),
                    desc: "Added via App",
                    note: f.get('note')
                };
                
                const json = JSON.stringify(newItem, null, 2) + ",";
                navigator.clipboard.writeText(json).then(() => {
                    alert("JSON copied to clipboard! Paste it into data.js");
                    document.getElementById('addModal').close();
                });
            }
        };
    </script>
</body>
</html>

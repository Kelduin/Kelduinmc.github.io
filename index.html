<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Our Hub</title>
    
    <link rel="apple-touch-icon" href="https://em-content.zobj.net/source/apple/354/clapper-board_1f3ac.png">
    <link rel="icon" type="image/png" href="https://em-content.zobj.net/source/apple/354/clapper-board_1f3ac.png">

    <style>
        :root {
            --bg-color: #050505;
            --card-bg: #1a1a1a;
            --text-color: #ffffff;
            --accent: #e50914;
            --green: #46d369;
            --pink: #ff69b4;
            --yellow: #fdd835;
            --gold: #ffd700;
            --card-width: 145px;
            --card-height: 220px;
            --radius: 12px;
            --safe-top: env(safe-area-inset-top);
            --safe-bottom: env(safe-area-inset-bottom);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0; padding: 0;
            padding-bottom: calc(90px + var(--safe-bottom));
            overflow-x: hidden; user-select: none;
        }

        /* --- LOADING SCREEN --- */
        #loadingScreen {
            position: fixed; inset: 0; background: var(--bg-color); z-index: 3000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: white; font-size: 1.2rem; font-weight: bold;
        }
        .spinner {
            width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.1);
            border-top-color: var(--accent); border-radius: 50%;
            animation: spin 1s linear infinite; margin-bottom: 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* --- HUB SCREEN --- */
        #hubScreen {
            position: fixed; inset: 0; background: linear-gradient(135deg, #050505 0%, #111 100%);
            z-index: 2000; display: none; flex-direction: column; 
            align-items: center; justify-content: center; gap: 20px; 
        }
        .hub-title { font-size: 2.2rem; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 2px; font-weight: 900; }
        
        .hub-btn {
            background: rgba(20,20,20,0.8); border: 2px solid; padding: 20px 30px;
            font-size: 1.3rem; font-weight: 800; text-transform: uppercase; border-radius: 20px;
            cursor: pointer; width: 85%; max-width: 350px;
            transition: transform 0.2s; backdrop-filter: blur(10px);
        }
        .hub-btn:active { transform: scale(0.96); }
        .btn-watch { border-color: var(--accent); color: var(--accent); }
        .btn-play { border-color: var(--green); color: var(--green); }

        .hub-sub-menu { display: none; flex-direction: column; gap: 12px; width: 85%; max-width: 350px; animation: fadeIn 0.2s ease-out; }
        .hub-sub-btn {
            background: #1a1a1a; color: white; border: 1px solid #333; padding: 18px;
            border-radius: 16px; font-size: 1.1rem; font-weight: 700; cursor: pointer;
            display: flex; align-items: center; gap: 15px; transition: background 0.2s;
        }
        .hub-sub-btn:active { background: #333; transform: scale(0.98); }
        @keyframes fadeIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }

        /* --- HEADER & CONTROLS --- */
        header {
            padding: calc(15px + var(--safe-top)) 20px 10px 20px;
            background: rgba(5,5,5,0.95); position: sticky; top: 0; z-index: 50;
            display: flex; align-items: center; justify-content: center; border-bottom: 1px solid #222;
        }
        .home-btn { position: absolute; left: 20px; background: #222; border: none; color: white; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; }
        h1 { margin: 0; font-size: 1.2rem; font-weight: 800; color: white; text-transform: uppercase; letter-spacing: 1px; }
        .header-actions { position: absolute; right: 20px; }
        .login-btn { background: #222; border: none; color: white; padding: 8px 14px; border-radius: 12px; font-size: 0.8rem; font-weight: bold; cursor: pointer; }

        .controls { padding: 15px; display: flex; flex-direction: column; gap: 12px; align-items: center; }
        .btn-roulette { background: #222; border: 1px solid #444; color: white; padding: 12px 40px; font-weight: 700; border-radius: 50px; cursor: pointer; width: 100%; max-width: 300px; transition: transform 0.1s; }
        .btn-roulette:active { transform: scale(0.96); }
        
        .filter-scroll { display: flex; gap: 8px; overflow-x: auto; width: 100%; padding-bottom: 5px; scrollbar-width: none; }
        .filter-scroll::-webkit-scrollbar { display: none; }
        .chip { background: #1a1a1a; color: #888; border: 1px solid #333; padding: 8px 16px; border-radius: 50px; font-size: 0.85rem; font-weight: 600; white-space: nowrap; cursor: pointer; transition: all 0.2s;}
        .chip.active { background: white; color: black; border-color: white; }

        .dropdown-row { display: flex; gap: 8px; width: 100%; }
        select, .form-input { width: 100%; appearance: none; background: #1a1a1a; color: white; border: 1px solid #333; padding: 12px 15px; border-radius: 12px; font-size: 0.9rem; font-weight: 500; outline: none; margin-bottom: 10px; }
        .select-wrapper { position: relative; flex: 1; }
        .select-wrapper::after { content: '▼'; font-size: 0.5rem; color: #666; position: absolute; right: 12px; top: 50%; transform: translateY(-50%); pointer-events: none; }

        /* --- LAYOUTS & CARDS --- */
        .section-header { padding: 0 20px; margin-top: 25px; margin-bottom: 10px; font-size: 1.1rem; font-weight: 700; color: #fff; letter-spacing: 0.5px; display: flex; align-items: center; justify-content: space-between;}
        
        .scroll-arrows { display: none; gap: 8px; }
        @media (hover: hover) { .scroll-arrows { display: flex; } }
        .arrow-btn { background: rgba(255,255,255,0.1); border: none; color: white; width: 28px; height: 28px; border-radius: 50%; cursor: pointer; font-weight: bold; }

        .row-container { display: flex; overflow-x: auto; gap: 12px; padding: 0 20px 10px 20px; scroll-snap-type: x mandatory; scrollbar-width: none; scroll-behavior: smooth; }
        .row-container::-webkit-scrollbar { display: none; }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(135px, 1fr)); gap: 12px; padding: 0 20px; margin-top: 15px; }

        .card { flex: 0 0 var(--card-width); height: var(--card-height); background: #111; border-radius: var(--radius); overflow: hidden; position: relative; scroll-snap-align: start; cursor: pointer; transition: transform 0.1s; }
        .card:active { transform: scale(0.96); }
        .card.dimmed { opacity: 0.35; filter: grayscale(100%); }
        .card-image { width: 100%; height: 100%; background-size: cover; background-position: center; }
        .imdb-badge { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.8); color: var(--gold); padding: 3px 6px; border-radius: 6px; font-size: 0.65rem; font-weight: bold; backdrop-filter: blur(4px); z-index: 5; }
        .card-overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 50%); display: flex; flex-direction: column; justify-content: flex-end; padding: 10px; }
        .card-title { font-size: 0.85rem; font-weight: 700; line-height: 1.2; margin-bottom: 4px; text-shadow: 0 2px 4px black; }
        .card-status { font-size: 0.7rem; display: flex; align-items: center; gap: 5px; font-weight: 600; }
        
        /* DYNAMIC DOT COLORS */
        .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
        .d-kacper { background: #3b82f6; box-shadow: 0 0 5px #3b82f6; }
        .d-scarlett { background: var(--pink); box-shadow: 0 0 5px var(--pink); }
        .d-note { background: var(--yellow); box-shadow: 0 0 5px var(--yellow); }
        .d-new { background: var(--green); box-shadow: 0 0 5px var(--green); }
        .d-done { background: #888; box-shadow: 0 0 5px #888; }
        
        .s-kacper { color: #3b82f6; }
        .s-scarlett { color: var(--pink); }
        .s-note { color: var(--yellow); }
        .s-new { color: var(--green); }
        .s-done { color: #888; }

        /* --- MODALS --- */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 2500; display: none; flex-direction: column; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        .modal-glow { position: absolute; inset: 0; background-size: cover; background-position: center; filter: blur(80px) saturate(200%); opacity: 0.4; z-index: 0; transform: scale(1.1); pointer-events: none; }
        .close-btn-float { position: absolute; top: calc(20px + var(--safe-top)); right: 20px; background: rgba(0,0,0,0.6); color: white; border: 1px solid #444; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; font-weight: bold; z-index: 2600; display: flex; align-items: center; justify-content: center;}
        
        .nav-zone { position: absolute; top: 0; bottom: 0; width: 15%; z-index: 2600; cursor: pointer; }
        .nav-left { left: 0; } .nav-right { right: 0; }

        .info-card { width: 92%; max-width: 420px; max-height: 85vh; background: #141414; border: 1px solid #2a2a2a; border-radius: 20px; display: flex; flex-direction: column; overflow-y: auto; position: relative; z-index: 10; box-shadow: 0 20px 50px rgba(0,0,0,0.8); }
        .info-hero { height: 280px; width: 100%; background-size: cover; background-position: top center; position: relative; flex-shrink: 0; }
        .info-hero::after { content:''; position:absolute; inset:0; background: linear-gradient(to top, #141414 0%, rgba(20,20,20,0.4) 50%, transparent); }
        .info-content { padding: 0 25px 25px 25px; margin-top: -30px; position: relative; z-index: 5; }
        .info-title { font-size: 1.8rem; font-weight: 800; margin-bottom: 12px; text-shadow: 0 2px 10px rgba(0,0,0,1); }
        .tag-pill { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); padding: 4px 10px; border-radius: 8px; color: #ddd; font-size: 0.75rem; display: inline-block; margin: 0 5px 5px 0; backdrop-filter: blur(4px); }
        .info-desc { color: #bbb; line-height: 1.5; margin: 15px 0; font-size: 0.95rem; }
        
        .form-box { background: #111; border: 1px solid #222; border-radius: 20px; padding: 25px; width: 90%; max-width: 450px; max-height: 85vh; overflow-y: auto; display: flex; flex-direction: column; position: relative; z-index: 2601; }
        .form-box h2 { margin: 0 0 15px 0; font-size: 1.4rem; }
        .form-btn { background: var(--accent); color: white; border: none; padding: 14px; border-radius: 12px; font-weight: bold; font-size: 1rem; cursor: pointer; margin-top: 10px; }
        
        .search-box { display: flex; gap: 8px; margin-bottom: 10px; }
        .search-btn { background: #333; color: white; border: none; border-radius: 12px; padding: 0 15px; font-weight: bold; cursor: pointer; }

        .tmdb-results { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; max-height: 300px; overflow-y: auto; }
        .tmdb-item { display: flex; gap: 10px; background: #1a1a1a; padding: 8px; border-radius: 8px; cursor: pointer; align-items: center; border: 1px solid #333; }
        .tmdb-item:active { background: #333; }
        .tmdb-item img { width: 40px; height: 60px; object-fit: cover; border-radius: 4px; }

        .add-float-btn { position: fixed; bottom: calc(20px + var(--safe-bottom)); right: 20px; background: var(--accent); color: white; border: none; width: 60px; height: 60px; border-radius: 50%; font-size: 2rem; display: none; align-items: center; justify-content: center; box-shadow: 0 5px 15px rgba(229,9,20,0.5); cursor: pointer; z-index: 1000; }

        .roulette-wrapper { width: 95%; max-width: 500px; height: 180px; border: 2px solid #333; background: #000; overflow: hidden; position: relative; margin: 0 auto; border-radius: 16px;}
        .roulette-track { display: flex; height: 100%; position: absolute; left: 0; }
        .r-card { width: 130px; height: 100%; background-size: cover; border-right: 1px solid #111; flex-shrink: 0; }
        .r-line { position: absolute; left: 50%; top: 0; bottom: 0; width: 4px; background: var(--gold); transform: translateX(-50%); z-index: 10; box-shadow: 0 0 15px var(--gold); }
    </style>
</head>
<body>

    <div id="loadingScreen">
        <div class="spinner"></div>
        <div id="loadingText">Syncing Hub...</div>
    </div>

    <!-- MAIN HUB -->
    <div id="hubScreen">
        <h1 class="hub-title">The Hub</h1>
        
        <button onclick="window.showSubMenu('watch')" class="hub-btn btn-watch">🍿 Watch</button>
        <button onclick="window.showSubMenu('play')" class="hub-btn btn-play">🎮 Play</button>

        <!-- WATCH SUBMENU -->
        <div id="watchSubMenu" class="hub-sub-menu">
            <button onclick="window.enterSection('watch_shared')" class="hub-sub-btn" style="border-left: 4px solid var(--accent);">💞 Our Watchlist</button>
            <button onclick="window.enterSection('watch_kacper')" class="hub-sub-btn" style="border-left: 4px solid #3b82f6;">👤 Kacper's List</button>
            <button onclick="window.enterSection('watch_scarlett')" class="hub-sub-btn" style="border-left: 4px solid var(--pink);">👤 Scarlett's List</button>
            <button onclick="window.resetHub()" style="background:transparent; border:none; color:#666; padding:10px;">« Back</button>
        </div>

        <!-- PLAY SUBMENU -->
        <div id="playSubMenu" class="hub-sub-menu">
            <button onclick="window.enterSection('game_shared')" class="hub-sub-btn" style="border-left: 4px solid var(--green);">💞 Games (Together)</button>
            <button onclick="window.enterSection('game_kacper')" class="hub-sub-btn" style="border-left: 4px solid #3b82f6;">👤 Games (Kacper)</button>
            <button onclick="window.enterSection('game_scarlett')" class="hub-sub-btn" style="border-left: 4px solid var(--pink);">👤 Games (Scarlett)</button>
            <button onclick="window.resetHub()" style="background:transparent; border:none; color:#666; padding:10px;">« Back</button>
        </div>
    </div>

    <header>
        <button class="home-btn" onclick="window.goHome()">🏠</button>
        <h1 id="appTitle">Our Hub</h1>
        <div class="header-actions">
            <button id="authBtn" class="login-btn" onclick="document.getElementById('loginModal').style.display='flex'">Login</button>
        </div>
    </header>

    <div class="controls">
        <button class="btn-roulette" onclick="window.startRoulette()">🎲 Spin the Wheel</button>
        <div class="filter-scroll" id="categoryChips"></div>
        <div class="dropdown-row">
            <div class="select-wrapper"><select id="statusFilter" onchange="window.updateUI()"></select></div>
            <div class="select-wrapper"><select id="sortOrder" onchange="window.updateUI()">
                <option value="default">Sort: Default</option>
                <option value="year">Date: Newest</option>
                <option value="imdb">Rating: High</option>
                <option value="az">A-Z</option>
            </select></div>
        </div>
    </div>

    <div id="mainContent"></div>

    <button id="addBtnFloat" class="add-float-btn" onclick="window.openAddModal()">+</button>

    <!-- INFO MODAL -->
    <div class="modal-overlay" id="infoModal" onclick="window.closeModalBackground(event)">
        <div id="modalGlow" class="modal-glow"></div>
        <button class="close-btn-float" onclick="window.closeAllModals()">✕</button>
        <div class="info-card" id="infoCard" onclick="event.stopPropagation()">
            <div class="info-hero" id="mHero"></div>
            <div class="info-content">
                <div class="info-title" id="mTitle"></div>
                <div id="mTags"></div>
                <div class="info-desc" id="mDesc"></div>
                <div id="mNoteBox" style="display:none;"><div style="background:#1a1a1a; padding:15px; border-left:3px solid var(--accent); color:#ccc; font-style:italic;" id="mNote"></div></div>
                
                <div id="adminActions" style="display:none; margin-top: 25px; gap: 8px; flex-wrap: wrap; position: relative; z-index: 2700;">
                    <button id="markDoneBtn" class="form-btn" style="background: var(--green); flex: 1;" onclick="window.markItemDone()">✔ Done</button>
                    <button class="form-btn" style="background: #3b82f6; flex: 1;" onclick="window.openEditModal()">✎ Edit</button>
                    <button class="form-btn" style="background: #d32f2f; flex: 1;" onclick="window.deleteItem()">🗑 Del</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ROULETTE MODAL -->
    <div class="modal-overlay" id="rouletteModal" onclick="window.closeModalBackground(event)">
        <div style="text-align:center; width: 100%;" onclick="event.stopPropagation()">
            <h2 style="color:var(--gold); margin-bottom:20px;">Rolling...</h2>
            <div class="roulette-wrapper"><div class="r-line"></div><div class="roulette-track" id="rTrack"></div></div>
            <h1 id="rWinner" style="color:white; margin-top:25px; opacity:0; transition:0.5s;">???</h1>
            <button class="chip" style="margin-top:20px; background:#333; color:white; border:none;" onclick="window.closeAllModals()">Close</button>
        </div>
    </div>

    <!-- LOGIN MODAL -->
    <div class="modal-overlay" id="loginModal" onclick="window.closeModalBackground(event)">
        <div class="form-box" onclick="event.stopPropagation()">
            <h2>Admin Login</h2>
            <input type="email" id="loginEmail" class="form-input" placeholder="Email">
            <div style="position: relative;">
                <input type="password" id="loginPass" class="form-input" placeholder="Password" style="margin-bottom: 12px; padding-right: 40px;">
                <button onclick="window.togglePassword()" style="position: absolute; right: 10px; top: 10px; background: none; border: none; font-size: 1.2rem; cursor: pointer;">👁️</button>
            </div>
            <button class="form-btn" onclick="window.submitLogin()">Login</button>
        </div>
    </div>

    <!-- ADD/EDIT MODAL -->
    <div class="modal-overlay" id="addModal" onclick="window.closeModalBackground(event)">
        <div class="form-box" onclick="event.stopPropagation()">
            <h2 id="addModalTitle">Add New</h2>
            
            <div class="search-box">
                <input type="text" id="tmdbSearchInput" class="form-input" style="margin:0;" placeholder="Search TMDb for autofill...">
                <button class="search-btn" onclick="window.searchTMDb()">Search</button>
            </div>
            <div id="tmdbResults" class="tmdb-results"></div>

            <div class="select-wrapper" style="margin-bottom:10px;">
                <select id="addListType" class="form-input" style="margin:0;">
                    <option value="watch_shared">List: Our Watchlist</option>
                    <option value="watch_kacper">List: Kacper's Watchlist</option>
                    <option value="watch_scarlett">List: Scarlett's Watchlist</option>
                    <option value="game_shared">List: Games (Together)</option>
                    <option value="game_kacper">List: Games (Kacper)</option>
                    <option value="game_scarlett">List: Games (Scarlett)</option>
                </select>
            </div>

            <div class="select-wrapper" style="margin-bottom:10px;">
                <select id="addCat" class="form-input" style="margin:0;">
                    <option value="MOVIE">Category: MOVIE</option>
                    <option value="SHOW">Category: SHOW</option>
                    <option value="ANIME">Category: ANIME</option>
                    <option value="YOUTUBE">Category: YOUTUBE</option>
                    <option value="RPG">Category: RPG</option>
                    <option value="ACTION">Category: ACTION</option>
                    <option value="SURVIVAL">Category: SURVIVAL</option>
                    <option value="CO-OP">Category: CO-OP</option>
                    <option value="STRATEGY">Category: STRATEGY</option>
                    <option value="RACING">Category: RACING</option>
                    <option value="SIMULATOR">Category: SIMULATOR</option>
                    <option value="OTHER">Category: OTHER</option>
                </select>
            </div>

            <input type="text" id="addTitle" class="form-input" placeholder="Title">
            
            <div style="display:flex; gap:10px; margin-bottom:10px; align-items:center;">
                <div style="font-size:0.9rem; color:#fff; display:flex; align-items:center; gap:8px;">
                    <input type="checkbox" id="addStarted" style="width: 18px; height: 18px;"> 
                    <label for="addStarted">Currently Watching/Playing (Pin to top)</label>
                </div>
            </div>

            <div style="display:flex; gap:10px; margin-bottom:10px; align-items:center;">
                <div class="select-wrapper" style="flex:1;">
                    <select id="addGroupSelect" class="form-input" style="margin:0;" onchange="window.handleGroupChange()">
                        <option value="">Group: None (Library)</option>
                    </select>
                </div>
                <div style="font-size:0.8rem; color:#888;">
                    <input type="checkbox" id="newGroupCheck" onchange="window.handleGroupChange()"> New
                </div>
            </div>
            <input type="text" id="addCustomGroup" class="form-input" placeholder="Type new group name..." style="display:none;">

            <input type="number" id="addYear" class="form-input" placeholder="Year">
            
            <div style="display:flex; gap:10px; margin-bottom:10px;">
                <div class="select-wrapper">
                    <select id="addMe" class="form-input" style="margin:0;">
                        <option value="new">My Status: New</option>
                        <option value="note">My Status: Playing/Note</option>
                        <option value="done">My Status: Done</option>
                    </select>
                </div>
                <div class="select-wrapper">
                    <select id="addHer" class="form-input" style="margin:0;">
                        <option value="new">Her Status: New</option>
                        <option value="note">Her Status: Playing/Note</option>
                        <option value="done">Her Status: Done</option>
                    </select>
                </div>
            </div>
            
            <input type="number" step="0.1" id="addImdb" class="form-input" placeholder="Rating (e.g. 8.5)">
            <input type="text" id="addTags" class="form-input" placeholder="Tags (comma separated)">
            <input type="text" id="addImage" class="form-input" placeholder="Image URL">
            <textarea id="addDesc" class="form-input" placeholder="Description" rows="2" style="resize:none;"></textarea>
            <input type="text" id="addNote" class="form-input" placeholder="Personal Note">
            
            <button class="form-btn" id="saveItemBtn" onclick="window.submitAddItem()">Save</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC9KrLCdD_UXrz3EyT0KodSD27hd60VTGM",
            authDomain: "our-hub-513cb.firebaseapp.com",
            projectId: "our-hub-513cb",
            storageBucket: "our-hub-513cb.firebasestorage.app",
            messagingSenderId: "1044308960028",
            appId: "1:1044308960028:web:4672375eb04fc0740c50d9"
        };
        const TMDB_KEY = "651abf9776feb8aec08bc18864a9b3be";

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let allData = [];
        let currentList = [];
        let currentCategory = 'all';
        let currentMode = 'watch_shared'; 
        let isAdmin = false;
        let editingItemId = null; 
        let currentModalList = [];
        let currentModalIndex = 0;
        
        const listTitles = {
            'watch_shared': 'Our Watchlist', 'watch_kacper': "Kacper's Watchlist", 'watch_scarlett': "Scarlett's Watchlist",
            'game_shared': 'Games (Together)', 'game_kacper': 'Games (Kacper)', 'game_scarlett': 'Games (Scarlett)'
        };

        onAuthStateChanged(auth, (user) => {
            const authBtn = document.getElementById('authBtn');
            if (user && !user.isAnonymous) {
                isAdmin = true;
                document.getElementById('addBtnFloat').style.display = 'flex';
                authBtn.innerText = "Logout";
                authBtn.onclick = () => window.submitLogout();
            } else {
                isAdmin = false;
                document.getElementById('addBtnFloat').style.display = 'none';
                authBtn.innerText = "Login";
                authBtn.onclick = () => document.getElementById('loginModal').style.display='flex';
            }
        });

        async function initApp() {
            try { await signInAnonymously(auth); } catch (e) { console.log("Waiting for auth"); }
            fetchData();
        }

        function fetchData() {
            const mediaCol = collection(db, 'artifacts', 'our-hub', 'public', 'data', 'media');
            onSnapshot(mediaCol, (snapshot) => {
                allData = [];
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    let listType = data.listType;
                    if (!listType) {
                        if (data.type === 'watch') listType = 'watch_shared';
                        else if (data.type === 'together') listType = 'game_shared';
                        else if (data.type === 'alone') listType = 'game_kacper';
                        else listType = 'watch_shared';
                    }
                    allData.push({ ...data, id: doc.id, listType });
                });

                document.getElementById('loadingScreen').style.display = 'none';
                if (document.getElementById('hubScreen').style.display === 'none') {
                    window.enterSection(currentMode, true); 
                } else {
                    document.getElementById('hubScreen').style.display = 'flex';
                }
            }, (error) => {
                document.getElementById('loadingText').innerText = "Database error.";
            });
        }

        // --- AUTH & MISC ---
        window.submitLogin = async () => {
            try {
                await signInWithEmailAndPassword(auth, document.getElementById('loginEmail').value, document.getElementById('loginPass').value);
                document.getElementById('loginEmail').value = ""; document.getElementById('loginPass').value = "";
                window.closeAllModals();
            } catch (e) { alert("Login failed"); }
        };

        window.submitLogout = async () => {
            await signOut(auth); await signInAnonymously(auth);
            window.closeAllModals();
        };

        window.togglePassword = () => {
            const input = document.getElementById('loginPass');
            input.type = input.type === 'password' ? 'text' : 'password';
        };

        // --- NEW DYNAMIC STATUS LOGIC ---
        function getStatusInfo(item) {
            let isDone = (item.me === true && item.her === true);
            let isNew = (item.me === false && item.her === false);
            let hasTextNote = !!(item.note && item.note.trim() !== "");

            let dots = [];
            let text = "";
            let textClass = "";

            if (isDone && !hasTextNote) {
                return { html: `<span class="status-dot d-done"></span><span class="s-done">Done</span>`, code: 'done' };
            }
            if (isNew && !hasTextNote) {
                return { html: `<span class="status-dot d-new"></span><span class="s-new">New</span>`, code: 'new' };
            }

            // Collect necessary dots
            if (item.me === true || item.me === 'note') dots.push('d-kacper');
            if (item.her === true || item.her === 'note') dots.push('d-scarlett');
            if (item.me === 'note' || item.her === 'note' || hasTextNote) dots.push('d-note');

            // Remove duplicate dots
            dots = [...new Set(dots)];

            // Decide primary text
            if (hasTextNote || item.me === 'note' || item.her === 'note') {
                text = "Note"; textClass = "s-note";
            } else if (item.me === true && item.her === false) {
                text = "Kacper"; textClass = "s-kacper";
            } else if (item.me === false && item.her === true) {
                text = "Scarlett"; textClass = "s-scarlett";
            } else {
                text = "Done"; textClass = "s-done";
            }

            let dotsHtml = dots.map(d => `<span class="status-dot ${d}"></span>`).join('');
            let sortCode = (text === 'Done') ? 'done' : (text === 'New' ? 'new' : 'note');
            
            return { html: `${dotsHtml} <span class="${textClass}">${text}</span>`, code: sortCode };
        }

        // --- TMDb Integration ---
        window.searchTMDb = async () => {
            const query = document.getElementById('tmdbSearchInput').value.trim();
            if (!query) return;
            const resDiv = document.getElementById('tmdbResults');
            resDiv.innerHTML = "Searching...";
            try {
                const res = await fetch(`https://api.themoviedb.org/3/search/multi?api_key=${TMDB_KEY}&query=${encodeURIComponent(query)}`);
                const data = await res.json();
                resDiv.innerHTML = "";
                if (!data.results || data.results.length === 0) { resDiv.innerHTML = "No results found."; return; }
                
                let validResults = data.results.filter(item => item.media_type === 'movie' || item.media_type === 'tv');
                validResults.sort((a, b) => (b.popularity || 0) - (a.popularity || 0));

                validResults.slice(0, 12).forEach(item => {
                    const title = item.title || item.name;
                    const year = (item.release_date || item.first_air_date || "").substring(0, 4);
                    const img = item.poster_path ? `https://image.tmdb.org/t/p/w500${item.poster_path}` : '';
                    
                    const div = document.createElement('div');
                    div.className = 'tmdb-item';
                    div.innerHTML = `<img src="${img || 'https://placehold.co/40x60?text=NA'}"> <div><b>${title}</b> (${year})</div>`;
                    div.onclick = () => {
                        document.getElementById('addTitle').value = title;
                        document.getElementById('addYear').value = year;
                        document.getElementById('addImdb').value = (item.vote_average || 0).toFixed(1);
                        document.getElementById('addImage').value = img;
                        document.getElementById('addDesc').value = item.overview || "";
                        resDiv.innerHTML = "";
                        document.getElementById('tmdbSearchInput').value = "";
                    };
                    resDiv.appendChild(div);
                });
            } catch (e) { resDiv.innerHTML = "Search failed."; }
        };

        // --- Form Logic ---
        window.handleGroupChange = () => {
            const isNew = document.getElementById('newGroupCheck').checked;
            document.getElementById('addGroupSelect').style.display = isNew ? 'none' : 'block';
            document.getElementById('addCustomGroup').style.display = isNew ? 'block' : 'none';
        };

        function populateGroupDropdown() {
            const sel = document.getElementById('addGroupSelect');
            sel.innerHTML = '<option value="">Group: None (Library)</option>';
            const groups = [...new Set(allData.filter(i => i.group).map(i => i.group))].sort();
            groups.forEach(g => {
                const opt = document.createElement('option');
                opt.value = g; opt.innerText = "Group: " + g;
                sel.appendChild(opt);
            });
        }

        window.openAddModal = () => {
            editingItemId = null;
            document.getElementById('addModalTitle').innerText = "Add New";
            document.getElementById('saveItemBtn').innerText = "Save";
            
            document.getElementById('addListType').value = currentMode;
            document.getElementById('addCat').value = currentMode.includes('watch') ? 'MOVIE' : 'RPG';
            document.getElementById('addTitle').value = "";
            document.getElementById('addStarted').checked = false;
            document.getElementById('addYear').value = "";
            document.getElementById('addMe').value = "new";
            document.getElementById('addHer').value = "new";
            document.getElementById('addImdb').value = "";
            document.getElementById('addTags').value = "";
            document.getElementById('addImage').value = "";
            document.getElementById('addDesc').value = "";
            document.getElementById('addNote').value = "";
            
            document.getElementById('newGroupCheck').checked = false;
            populateGroupDropdown();
            window.handleGroupChange();

            document.getElementById('addModal').style.display = 'flex';
        };

        window.openEditModal = () => {
            const item = currentModalList[currentModalIndex];
            if (!item) return;
            editingItemId = item.id;
            document.getElementById('addModalTitle').innerText = "Edit Item";
            document.getElementById('saveItemBtn').innerText = "Update";

            const sStr = (s) => (s === true) ? 'done' : (s === false ? 'new' : 'note');

            document.getElementById('addListType').value = item.listType || currentMode;
            document.getElementById('addCat').value = item.category || 'MOVIE';
            document.getElementById('addTitle').value = item.title || '';
            document.getElementById('addStarted').checked = item.isStarted === true;
            document.getElementById('addYear').value = item.year || '';
            document.getElementById('addMe').value = sStr(item.me);
            document.getElementById('addHer').value = sStr(item.her);
            document.getElementById('addImdb').value = item.imdb || '';
            document.getElementById('addTags').value = item.tags || '';
            document.getElementById('addImage').value = item.image || '';
            document.getElementById('addDesc').value = item.desc || '';
            document.getElementById('addNote').value = item.note || '';

            populateGroupDropdown();
            document.getElementById('newGroupCheck').checked = false;
            window.handleGroupChange();
            if (item.group) document.getElementById('addGroupSelect').value = item.group;

            // Notice we are NOT clearing editingItemId here.
            document.getElementById('infoModal').style.display = 'none';
            document.getElementById('addModal').style.display = 'flex';
        };

        window.submitAddItem = async () => {
            const btn = document.getElementById('saveItemBtn');
            btn.disabled = true;

            const pStatus = (v) => v === 'done' ? true : (v === 'new' ? false : 'note');
            const isNewGrp = document.getElementById('newGroupCheck').checked;
            const finalGroup = isNewGrp ? document.getElementById('addCustomGroup').value.trim() : document.getElementById('addGroupSelect').value;

            const itemData = {
                listType: document.getElementById('addListType').value,
                category: document.getElementById('addCat').value,
                title: document.getElementById('addTitle').value.trim(),
                isStarted: document.getElementById('addStarted').checked,
                year: parseInt(document.getElementById('addYear').value) || 0,
                me: pStatus(document.getElementById('addMe').value),
                her: pStatus(document.getElementById('addHer').value),
                imdb: parseFloat(document.getElementById('addImdb').value) || 0,
                tags: document.getElementById('addTags').value.trim(),
                image: document.getElementById('addImage').value.trim(),
                desc: document.getElementById('addDesc').value.trim(),
                note: document.getElementById('addNote').value.trim(),
                group: finalGroup
            };

            try {
                const colRef = collection(db, 'artifacts', 'our-hub', 'public', 'data', 'media');
                if (editingItemId) {
                    await updateDoc(doc(colRef, editingItemId), itemData);
                } else { 
                    itemData.timestamp = Date.now(); 
                    await addDoc(colRef, itemData); 
                }
                
                // Clear out editing state on successful save
                editingItemId = null;
                window.closeAllModals();
            } catch (e) { alert("Error saving."); }
            btn.disabled = false;
        };

        window.markItemDone = async () => {
            const item = currentModalList[currentModalIndex];
            if (!item.id) return;
            await updateDoc(doc(db, 'artifacts', 'our-hub', 'public', 'data', 'media', item.id), { me: true, her: true });
            window.closeAllModals();
        };

        window.deleteItem = async () => {
            const item = currentModalList[currentModalIndex];
            if (!item.id || !confirm(`Delete "${item.title}"?`)) return;
            await deleteDoc(doc(db, 'artifacts', 'our-hub', 'public', 'data', 'media', item.id));
            window.closeAllModals();
        };

        // --- Navigation ---
        window.showSubMenu = (menu) => {
            document.querySelectorAll('.hub-btn').forEach(b => b.style.display = 'none');
            if(menu === 'watch') document.getElementById('watchSubMenu').style.display = 'flex';
            if(menu === 'play') document.getElementById('playSubMenu').style.display = 'flex';
        };
        window.resetHub = () => {
            document.querySelectorAll('.hub-btn').forEach(b => b.style.display = 'block');
            document.querySelectorAll('.hub-sub-menu').forEach(m => m.style.display = 'none');
        };
        window.goHome = () => { document.getElementById('hubScreen').style.display = 'flex'; window.resetHub(); };

        window.enterSection = (mode, isRefresh = false) => {
            currentMode = mode;
            document.getElementById('hubScreen').style.display = 'none';
            document.getElementById('appTitle').innerText = listTitles[mode] || "Our Hub";
            
            currentList = allData.filter(i => i.listType === mode);

            if(!isRefresh) {
                const sFilter = document.getElementById('statusFilter');
                sFilter.innerHTML = `<option value="all">Status: All</option><option value="new">✨ New</option><option value="note">⚠️ Note</option><option value="done">✅ Done</option>`;
                currentCategory = 'all';
                document.getElementById('statusFilter').value = 'all';
                document.getElementById('sortOrder').value = 'default';
            }
            
            const cats = [...new Set(currentList.map(i => i.category).filter(Boolean))].sort();
            const chips = document.getElementById('categoryChips');
            chips.innerHTML = `<div class="chip ${currentCategory==='all'?'active':''}" onclick="window.setFilter('all', this)">All</div>`;
            cats.forEach(c => { chips.innerHTML += `<div class="chip ${currentCategory===c?'active':''}" onclick="window.setFilter('${c}', this)">${c}</div>`; });
            
            window.updateUI();
        };

        window.setFilter = (cat, btn) => {
            currentCategory = cat;
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            btn.classList.add('active');
            window.updateUI();
        };

        window.updateUI = () => {
            const main = document.getElementById('mainContent');
            const stat = document.getElementById('statusFilter').value;
            const sort = document.getElementById('sortOrder').value;

            let filtered = currentList.filter(i => {
                const sInfo = getStatusInfo(i);
                if (stat !== 'all' && sInfo.code !== stat) return false;
                if (currentCategory !== 'all' && i.category !== currentCategory) return false;
                return true;
            }).sort((a, b) => {
                if (sort === 'imdb') return (b.imdb || 0) - (a.imdb || 0);
                if (sort === 'year') return (b.year || 0) - (a.year || 0);
                if (sort === 'az') return a.title.localeCompare(b.title);
                return (b.timestamp || 0) - (a.timestamp || 0);
            });

            main.innerHTML = "";
            if (filtered.length === 0) { main.innerHTML = "<div style='padding:50px; text-align:center; color:#666;'>Empty.</div>"; return; }

            // 1. PINNED ROW (Started Items)
            let startedItems = filtered.filter(i => i.isStarted === true && getStatusInfo(i).code !== 'done');
            if (startedItems.length > 0) {
                const pinnedTitle = currentMode.includes('watch') ? '📺 Continue Watching' : '🎮 Continue Playing';
                renderRow(pinnedTitle, startedItems, main);
            }

            // 2. NORMAL GROUPS/CATEGORIES
            if (currentCategory === 'all') {
                const catsInView = [...new Set(filtered.map(i => i.category))].sort();
                catsInView.forEach(c => {
                    let items = filtered.filter(i => i.category === c);
                    if(items.length > 0) renderRow(c, items, main);
                });
            } else {
                let grouped = filtered.filter(i => i.group);
                let standalone = filtered.filter(i => !i.group);

                if (standalone.length > 0) renderRow('Library', standalone, main, true);

                const groups = [...new Set(grouped.map(i => i.group))].sort();
                groups.forEach(g => {
                    let items = grouped.filter(i => i.group === g).sort((a,b) => (a.year||0) - (b.year||0));
                    if(items.length > 0) {
                        let doneCount = items.filter(i => getStatusInfo(i).code === 'done').length;
                        let groupTitle = `${g} <span style="font-size:0.85rem; color:#888; font-weight:normal;">(${doneCount}/${items.length} Done)</span>`;
                        renderRow(groupTitle, items, main);
                    }
                });
            }
        };

        function renderRow(title, items, container, isRow=true) {
            const wrap = document.createElement('div');
            // FIX: Using a distinct class to grab the correct container div and wrapping the title securely
            const rowClass = isRow ? 'row-container' : 'grid-container';
            wrap.innerHTML = `
                <div class="section-header">
                    <div>${title}</div>
                    ${isRow ? `<div class="scroll-arrows"><button class="arrow-btn" onclick="window.scrollRow(this, -1)">‹</button><button class="arrow-btn" onclick="window.scrollRow(this, 1)">›</button></div>` : ''}
                </div>
                <div class="${rowClass} js-row-content"></div>
            `;
            const content = wrap.querySelector('.js-row-content');
            items.forEach(i => content.appendChild(createCard(i, items)));
            container.appendChild(wrap);
        }

        window.scrollRow = (btn, direction) => {
            const wrapper = btn.closest('div').parentElement.parentElement;
            const container = wrapper.querySelector('.row-container');
            if (container) {
                const scrollAmount = container.clientWidth * 0.8;
                container.scrollBy({ left: scrollAmount * direction, behavior: 'smooth' });
            }
        };

        function createCard(item, list) {
            const el = document.createElement('div');
            const sInfo = getStatusInfo(item);

            el.className = `card ${sInfo.code === 'done' ? 'dimmed' : ''}`;
            el.addEventListener('click', () => window.openModal(item, list));
            const bg = item.image || 'https://placehold.co/150x220?text=NA';
            
            el.innerHTML = `
                <div class="card-image" style="background-image:url('${bg}')"></div>
                ${item.imdb ? `<div class="imdb-badge">⭐ ${item.imdb}</div>` : ''}
                <div class="card-overlay">
                    <div class="card-title">${item.title}</div>
                    <div class="card-status">${sInfo.html}</div>
                </div>`;
            return el;
        }

        // Modal Management
        window.closeAllModals = () => {
            document.querySelectorAll('.modal-overlay').forEach(m => m.style.display = 'none');
            // Deliberately NOT resetting editingItemId here to preserve the Edit sequence.
        };

        window.closeModalBackground = (e) => {
            if (e.target.classList.contains('modal-overlay')) {
                window.closeAllModals();
                // Safe to reset here since background clicking means user aborted the edit
                editingItemId = null;
            }
        };

        window.openModal = (item, list) => {
            currentModalList = list;
            currentModalIndex = list.indexOf(item);
            document.getElementById('infoModal').style.display = 'flex';
            renderModalContent();
        };

        window.navigateModal = (direction) => {
            /* Since we disabled invisible edge clicks, this is only used for roulette right now, 
               but kept safe just in case we add real buttons later */
            const newIndex = currentModalIndex + direction;
            if (newIndex >= 0 && newIndex < currentModalList.length) {
                currentModalIndex = newIndex;
                renderModalContent();
            }
        };

        function renderModalContent() {
            try {
                const item = currentModalList[currentModalIndex];
                if (!item) return;

                const sInfo = getStatusInfo(item);
                
                const bgImage = item.image ? item.image : 'https://placehold.co/300x450?text=No+Image';
                document.getElementById('mHero').style.backgroundImage = `url('${bgImage}')`;
                document.getElementById('modalGlow').style.backgroundImage = `url('${bgImage}')`;
                document.getElementById('mTitle').innerText = item.title || 'Unknown Title';
                
                const tagsStr = item.tags ? String(item.tags) : '';
                const tgs = tagsStr ? tagsStr.split(',').map(t=>`<span class="tag-pill">${t.trim()}</span>`).join('') : '';
                const catText = item.group ? item.group : (item.category || '');
                
                document.getElementById('mTags').innerHTML = `
                    <div style="display:flex; align-items:center; gap:8px; margin-bottom:8px; font-weight:bold;">${sInfo.html}</div>
                    ${catText} ${item.year?'• '+item.year:''} ${item.imdb?'• ⭐ '+item.imdb:''}<br><br>${tgs}
                `;
                document.getElementById('mDesc').innerText = item.desc || '';
                
                const noteBox = document.getElementById('mNoteBox');
                if (item.note) {
                    noteBox.style.display = 'block';
                    document.getElementById('mNote').innerText = item.note;
                } else {
                    noteBox.style.display = 'none';
                }

                const adminActions = document.getElementById('adminActions');
                const markDoneBtn = document.getElementById('markDoneBtn');
                
                if (isAdmin) {
                    adminActions.style.display = 'flex';
                    markDoneBtn.style.display = sInfo.code === 'done' ? 'none' : 'block';
                } else { 
                    adminActions.style.display = 'none'; 
                }
            } catch (e) {
                console.error("Error rendering modal popup:", e);
            }
        }

        window.startRoulette = () => {
            const stat = document.getElementById('statusFilter').value;
            
            const candidates = currentList.filter(i => {
                const sInfo = getStatusInfo(i);
                const matchesStatus = stat === 'all' ? sInfo.code !== 'done' : sInfo.code === stat;
                const validStatus = stat === 'done' ? true : sInfo.code !== 'done'; 
                const matchesCat = currentCategory === 'all' || i.category === currentCategory;
                return matchesCat && matchesStatus && validStatus;
            });
            
            if (candidates.length === 0) { alert("Nothing found to roll!"); return; }

            document.getElementById('rouletteModal').style.display = 'flex';
            document.getElementById('rWinner').style.opacity = '0';
            const track = document.getElementById('rTrack');
            track.innerHTML = "";
            track.style.transition = 'none';
            track.style.transform = 'translateX(0)';
            
            const total = 50;
            const winIdx = 40;
            const winner = candidates[Math.floor(Math.random() * candidates.length)];
            
            for(let i=0; i<total; i++) {
                const it = (i===winIdx) ? winner : candidates[Math.floor(Math.random() * candidates.length)];
                const d = document.createElement('div');
                d.className = 'r-card';
                const bgImg = it.image && it.image.includes('http') ? it.image : 'https://placehold.co/300x450?text=No+Image';
                d.style.backgroundImage = `url('${bgImg}')`;
                track.appendChild(d);
            }

            setTimeout(() => {
                const cardW = 130;
                const offset = -((winIdx * cardW) + (cardW/2) - (track.parentElement.offsetWidth / 2));
                const jitter = Math.floor(Math.random()*20) - 10;
                track.style.transition = 'transform 4.5s cubic-bezier(0.1, 0, 0.2, 1)';
                track.style.transform = `translateX(${offset + jitter}px)`;
                setTimeout(() => {
                    document.getElementById('rWinner').innerText = winner.title;
                    document.getElementById('rWinner').style.opacity = '1';
                    setTimeout(() => { window.closeAllModals(); window.openModal(winner, candidates); document.getElementById('rouletteModal').style.display = 'none'; }, 1500);
                }, 4500);
            }, 50);
        };

        initApp();
    </script>
</body>
</html>
